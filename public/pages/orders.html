<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>Antrian — POS Laundry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }

    /* Nav.js sudah render topbar mobile — sembunyikan supaya tidak dobel */
    .pos-topbar { display: none !important; }

    /* ── Sticky Header ─────────────────────────────────── */
    .head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .head .back, .head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .head .back:hover, .head .ic-btn:hover { box-shadow: 0 2px 8px rgba(45,59,181,0.12); }
    .head .ttl { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }

    /* ── Search bar (toggle) ───────────────────────────── */
    .search-bar { padding: 0 16px 8px; display: none; }
    .search-bar.open { display: block; }
    .search-bar input {
      width: 100%; padding: 10px 14px; border: 1px solid #E2E8F0;
      border-radius: 10px; font-size: 14px; font-family: inherit;
      background: #fff; color: #1E2A6E; outline: none;
    }
    .search-bar input:focus { border-color: #2D3BB5; }

    /* ── Filter pills ──────────────────────────────────── */
    .pill-wrap { padding: 0 16px 12px; }
    .pills { display: flex; gap: 6px; overflow-x: auto; }
    .pill {
      flex: 1; min-width: max-content; height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid #E2E8F0; background: #fff;
      font-size: 12px; font-weight: 600; cursor: pointer;
      color: #64748B; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .pill:active { transform: scale(.97); }
    .pill.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }

    /* ── Body ──────────────────────────────────────────── */
    .body-wrap { padding: 4px 16px 130px; }

    .info-line {
      font-size: 12px; color: #64748B;
      margin-bottom: 10px; padding: 0 2px;
    }

    /* ── Order card (spek Komponen Konsisten) ──────────── */
    .order-list { display: flex; flex-direction: column; gap: 10px; }
    .order-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      display: flex; overflow: hidden;
    }
    .oc-bar { width: 4px; flex-shrink: 0; background: #94A3B8; }
    .oc-bar.s-pending  { background: #94A3B8; }
    .oc-bar.s-proses   { background: #4BB8FA; }
    .oc-bar.s-selesai  { background: #10B981; }
    .oc-bar.s-diambil  { background: #2D3BB5; }
    .oc-bar.s-lewat    { background: #EF4444; }
    .oc-bar.s-dibatalkan { background: #E2E8F0; }

    .oc-body {
      flex: 1; min-width: 0;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .oc-row1 {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .oc-nomor {
      font-size: 12px; font-weight: 700; color: #94A3B8;
      letter-spacing: 0.4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .oc-badges { display: inline-flex; gap: 5px; flex-shrink: 0; }

    .oc-row2 {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; cursor: pointer;
    }
    .oc-mid { min-width: 0; flex: 1; }
    .oc-nama {
      font-size: 15px; font-weight: 600; color: #1E2A6E; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .oc-svc {
      font-size: 13px; color: #64748B; margin-top: 2px; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .oc-dates {
      font-size: 12px; color: #64748B; margin-top: 4px; line-height: 1.3;
      display: flex; align-items: center; gap: 4px;
    }
    .oc-dates svg {
      flex-shrink: 0;
    }
    .oc-total {
      font-size: 15px; font-weight: 700; color: #1E2A6E; white-space: nowrap;
      flex-shrink: 0;
    }

    .oc-actions { display: flex; gap: 6px; }
    .oc-actions .btn {
      height: 36px; padding: 0 10px; font-size: 13px; font-weight: 600;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      text-decoration: none; font-family: inherit; white-space: nowrap;
      transition: opacity .15s;
    }
    .oc-actions .btn:active { opacity: .8; transform: scale(.98); }
    .btn-action  { flex: 1; background: #2D3BB5; color: #fff; }
    .btn-lunasi  { flex: 1; background: #fff; border-color: #10B981; color: #10B981; }
    .btn-wa      { width: 52px; flex-shrink: 0; background: #fff; border-color: #E2E8F0; color: #64748B; }
    .btn-label   { width: 60px; flex-shrink: 0; background: #fff; border-color: #E2E8F0; color: #8B5CF6; }

    /* ── Badge (spek README) ───────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
      line-height: 1;
    }
    .b-pending    { background: #F1F5F9; color: #64748B; }
    .b-proses     { background: #E3F2FF; color: #2563EB; }
    .b-selesai    { background: #E7F8F1; color: #10B981; }
    .b-diambil    { background: #2D3BB5; color: #fff; }
    .b-dibatalkan { background: #FDECEC; color: #EF4444; }
    .b-lunas      { background: #E7F8F1; color: #10B981; }
    .b-belum      { background: #FDECEC; color: #EF4444; }
    .b-dp         { background: #FEF3E2; color: #F59E0B; }

    /* ── Empty state (spek: teks tengah 13px #94A3B8) ── */
    .empty {
      text-align: center; padding: 40px 20px;
      color: #94A3B8; font-size: 13px;
    }

    /* ── Pagination ────────────────────────────────────── */
    .pagination {
      display: flex; justify-content: center; align-items: center; gap: 6px;
      margin-top: 14px; flex-wrap: wrap;
    }
    .pg-btn {
      min-width: 36px; height: 36px; padding: 0 10px;
      border: 1px solid #E2E8F0; background: #fff;
      border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
      font-family: inherit; color: #334155;
    }
    .pg-btn:hover:not(:disabled) { background: #F8FAFF; }
    .pg-btn.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }
    .pg-btn:disabled { opacity: .4; cursor: default; }

    /* ── Toast ─────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1E2A6E; color: #fff; padding: 10px 20px; border-radius: 99px;
      font-size: 13px; font-weight: 600; z-index: 9999;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #toast.show { opacity: 1; }

    /* ── DESKTOP (>= 1024px): table view ──────────────── */
    .desktop-only { display: none; }
    .mobile-only { display: block; }

    @media (min-width: 1024px) {
      .desktop-only { display: block; }
      .mobile-only { display: none; }
      .body-wrap { padding: 4px 20px 40px; }
      .head { padding: 18px 20px 10px; }
      .pill-wrap { padding: 0 20px 14px; }
      .search-bar { padding: 0 20px 10px; }

      .table-card {
        background: #fff; border-radius: 10px;
        box-shadow: 0 1px 3px rgba(45,59,181,0.08);
        overflow: hidden;
      }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 900px; }
      thead th {
        padding: 12px 14px; text-align: left; font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .5px; color: #64748B;
        background: #F8FAFF; border-bottom: 1px solid #E2E8F0;
        white-space: nowrap;
      }
      tbody tr { border-bottom: 1px solid #F1F5F9; transition: background .1s; }
      tbody tr:last-child { border-bottom: none; }
      tbody tr:hover { background: #F8FAFF; }
      tbody td { padding: 12px 14px; vertical-align: middle; font-size: 13px; color: #1E2A6E; }
      .td-nomor { font-weight: 700; white-space: nowrap; }
      .td-nomor a { color: #2D3BB5; text-decoration: none; }
      .td-nomor a:hover { text-decoration: underline; }
      .td-meta { font-size: 11px; color: #64748B; margin-top: 2px; }
      .td-actions-cell { white-space: nowrap; }
      .td-actions-cell .btn {
        padding: 6px 10px; font-size: 12px; height: 32px;
        border-radius: 6px; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 4px;
        border: 1px solid transparent; text-decoration: none; font-family: inherit;
        margin-right: 4px; width: auto; flex: none;
      }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="head">
    <a href="/dashboard" class="back" title="Kembali" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="ttl">Antrian</div>
    <button class="ic-btn" onclick="toggleSearch()" title="Cari" aria-label="Cari">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16.7 16.7"/></svg>
    </button>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Cari nomor order / nama pelanggan..."
           oninput="debounceLoad()"/>
  </div>

  <div class="pill-wrap">
    <div class="pills" id="pills">
      <button class="pill active" data-quick="semua">Semua</button>
      <button class="pill" data-quick="aktif">Aktif</button>
      <button class="pill" data-quick="selesai">Selesai</button>
      <button class="pill" data-quick="selesai_hari_ini">Selesai Hari Ini</button>
      <button class="pill" data-quick="lewat">Lewat Waktu</button>
    </div>
  </div>

  <div class="body-wrap">
    <div class="info-line" id="infoLine">Memuat...</div>

    <div class="mobile-only">
      <div class="order-list" id="cardList"></div>
    </div>

    <div class="desktop-only">
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No. Order</th>
                <th>Pelanggan</th>
                <th>Layanan</th>
                <th>Total</th>
                <th>Bayar</th>
                <th>Status</th>
                <th>Masuk</th>
                <th>Selesai</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="9" style="text-align:center;padding:40px;color:#94A3B8">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="pagination" id="pagination" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const fmtRp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const fmtDateShort = s => s ? new Date(s).toLocaleDateString('id-ID', { day:'2-digit', month:'short' }) : '—';
const fmtDate = s => s ? new Date(s).toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }) : '—';
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tampilkanNomor(nomor) {
  if (!nomor) return '';
  if (nomor.startsWith('628')) return '0' + nomor.slice(2);
  return nomor;
}

let currentPage = 1;
let totalPages  = 1;
let debTimer    = null;
let quickFilter = 'semua';

function showToast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
window.showToast = showToast;

function toggleSearch() {
  const bar = document.getElementById('searchBar');
  bar.classList.toggle('open');
  if (bar.classList.contains('open')) {
    document.getElementById('searchInput').focus();
  } else {
    document.getElementById('searchInput').value = '';
    loadOrders(1);
  }
}

function debounceLoad() {
  clearTimeout(debTimer);
  debTimer = setTimeout(() => loadOrders(1), 400);
}

function isLewat(t) {
  // Include 'selesai' juga: kalau order sudah selesai tapi belum diambil dan
  // sudah lewat tanggal estimasi, itu artinya pelanggan telat ambil — indikator
  // "lewat waktu" tetap perlu tampil supaya operator tahu untuk follow-up.
  // Status 'diambil' dan 'dibatalkan' TIDAK pernah dianggap lewat.
  if (!['pending','proses','selesai'].includes(t.status)) return false;
  if (!t.tanggal_selesai) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const est = new Date(t.tanggal_selesai); est.setHours(0,0,0,0);
  return est < today;
}

function payload(t) {
  return {
    id: t.id, nomor: t.nomor_transaksi, nama: t.pelanggan_nama,
    total: t.total_bayar, dibayar: t.bayar,
    pelanggan_id: t.pelanggan_id, telepon: t.pelanggan_telepon
  };
}
function waPayload(t) {
  return { id: t.id, nomor: t.nomor_transaksi, nama: t.pelanggan_nama, telepon: t.pelanggan_telepon };
}

async function loadOrders(page = 1) {
  currentPage = page;
  const q = document.getElementById('searchInput').value.trim();

  let status = '';
  let sortParam = '';
  let clientFilter = null;
  let selesaiHariIni = false;

  if (quickFilter === 'aktif') {
    clientFilter = t => ['pending','proses'].includes(t.status);
  } else if (quickFilter === 'selesai') {
    status = 'selesai';
  } else if (quickFilter === 'selesai_hari_ini') {
    selesaiHariIni = true;
  } else if (quickFilter === 'lewat') {
    clientFilter = isLewat;
  }

  const params = new URLSearchParams({ page, limit: clientFilter ? 200 : 20 });
  if (q)              params.set('q', q);
  if (status)         params.set('status', status);
  if (selesaiHariIni) params.set('selesai_hari_ini', '1');
  if (sortParam)      params.set('sort', sortParam);

  document.getElementById('cardList').innerHTML = '<div class="empty">Memuat…</div>';
  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="9" style="text-align:center;padding:40px;color:#94A3B8">Memuat...</td></tr>';

  try {
    const r = await fetch('/api/v1/transaksi?' + params, { credentials: 'include' });
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();

    let data = d.data || [];
    const meta = d.meta || {};

    if (clientFilter) data = data.filter(clientFilter);

    const totalAll = clientFilter ? data.length : (meta.total || 0);
    totalPages = clientFilter ? 1 : Math.max(1, Math.ceil((meta.total || 0) / 20));

    document.getElementById('infoLine').textContent =
      `Menampilkan ${data.length} dari ${totalAll} order`;

    renderCards(data);
    renderTable(data);
    renderPagination(totalAll);
  } catch (err) {
    console.error(err);
    document.getElementById('cardList').innerHTML = '<div class="empty">Gagal memuat data</div>';
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="8" style="text-align:center;padding:40px;color:#94A3B8">Gagal memuat data</td></tr>';
  }
}

function statusLabel(s) {
  return ({ pending: 'Pending', proses: 'Proses', selesai: 'Selesai', diambil: 'Diambil', dibatalkan: 'Batal' })[s] || (s || '');
}

function nextStatus(s) {
  return ({ pending: 'proses', proses: 'selesai', selesai: 'diambil' })[s] || null;
}
function nextStatusLabel(s) {
  return ({ pending: 'Proses', proses: 'Selesai', selesai: 'Diambil' })[s] || '';
}

function renderCards(rows) {
  const el = document.getElementById('cardList');
  if (!rows.length) {
    el.innerHTML = '<div class="empty">Tidak ada order di filter ini</div>';
    return;
  }

  el.innerHTML = rows.map(t => {
    const lunas = (Number(t.bayar) || 0) >= Number(t.total_bayar);
    const isDP = !lunas && Number(t.bayar) > 0;
    const lewat = isLewat(t);
    const tel = t.pelanggan_telepon;
    const barCls = lewat ? 's-lewat' : 's-' + t.status;
    const layanan = t.layanan_ringkas || '—';
    const pl = JSON.stringify(payload(t)).replace(/'/g, "&#39;");
    const wp = JSON.stringify(waPayload(t)).replace(/'/g, "&#39;");

    const badgeStatus = `<span class="badge b-${t.status}">${statusLabel(t.status)}</span>`;
    const badgePay = lunas
      ? '<span class="badge b-lunas">Lunas</span>'
      : (isDP ? '<span class="badge b-dp">DP</span>' : '<span class="badge b-belum">Belum Lunas</span>');

    // Format tanggal masuk dan selesai
    const masukLabel = fmtDateShort(t.tanggal_masuk);
    const selesaiLabel = t.status === 'selesai' || t.status === 'diambil'
      ? fmtDateShort(t.updated_at)
      : fmtDateShort(t.tanggal_selesai);
    const selesaiText = t.status === 'selesai' || t.status === 'diambil' ? 'Selesai' : 'Estimasi';

    const next = nextStatus(t.status);
    const actions = [];
    if (next && t.status !== 'dibatalkan') {
      actions.push(`<button class="btn btn-action" onclick="updateStatus(${t.id},'${next}',this)">${nextStatusLabel(t.status)}</button>`);
    }
    if (!lunas && t.status !== 'dibatalkan') {
      actions.push(`<button class="btn btn-lunasi" onclick='openLunasiSheet(${pl})'>Lunasi</button>`);
    }
    if (tel && t.status !== 'dibatalkan') {
      actions.push(`<button class="btn btn-wa" onclick='openWaSheet(${wp})' aria-label="Kirim WA">WA</button>`);
    }
    if (t.status !== 'dibatalkan') {
      actions.push(`<button class="btn btn-label" onclick="openLabelSheet(${t.id})" aria-label="Cetak Label">Label</button>`);
    }

    return `
      <div class="order-card">
        <div class="oc-bar ${barCls}"></div>
        <div class="oc-body">
          <div class="oc-row1">
            <div class="oc-nomor">${escHtml(t.nomor_transaksi)}</div>
            <div class="oc-badges">${badgeStatus}${badgePay}</div>
          </div>
          <div class="oc-row2" onclick="location.href='/order/detail?id=${t.id}'">
            <div class="oc-mid">
              <div class="oc-nama">${escHtml(t.pelanggan_nama || 'Non-member')}</div>
              <div class="oc-svc" title="${escHtml(layanan)}">${escHtml(layanan)}</div>
              <div class="oc-dates">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span>Masuk: ${masukLabel} · ${selesaiText}: ${selesaiLabel}</span>
              </div>
            </div>
            <div class="oc-total">${fmtRp(t.total_bayar)}</div>
          </div>
          ${actions.length ? `<div class="oc-actions" onclick="event.stopPropagation()">${actions.join('')}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:#94A3B8">Tidak ada order di filter ini</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(t => {
    const lunas = (Number(t.bayar) || 0) >= Number(t.total_bayar);
    const isDP = !lunas && Number(t.bayar) > 0;
    const lewat = isLewat(t);
    const tel = t.pelanggan_telepon;
    const telDisplay = tampilkanNomor(tel);
    const pl = JSON.stringify(payload(t)).replace(/'/g, "&#39;");
    const wp = JSON.stringify(waPayload(t)).replace(/'/g, "&#39;");

    const badgeStatus = `<span class="badge b-${t.status}">${statusLabel(t.status)}</span>`;
    const badgePay = lunas
      ? '<span class="badge b-lunas">Lunas</span>'
      : (isDP ? '<span class="badge b-dp">DP</span>' : '<span class="badge b-belum">Belum Lunas</span>');

    // Tanggal selesai: jika sudah selesai/diambil gunakan updated_at, jika belum gunakan estimasi
    const selesaiDate = (t.status === 'selesai' || t.status === 'diambil') ? t.updated_at : t.tanggal_selesai;
    const selesaiLabel = (t.status === 'selesai' || t.status === 'diambil') ? 'Selesai' : 'Est.';

    let actions = '';
    const next = nextStatus(t.status);
    if (next && t.status !== 'dibatalkan') {
      actions += `<button class="btn btn-action" onclick="updateStatus(${t.id},'${next}',this)">${nextStatusLabel(t.status)}</button>`;
    }
    if (!lunas && t.status !== 'dibatalkan') {
      actions += `<button class="btn btn-lunasi" onclick='openLunasiSheet(${pl})'>Lunasi</button>`;
    }
    if (tel && t.status !== 'dibatalkan') {
      actions += `<button class="btn btn-wa" onclick='openWaSheet(${wp})'>WA</button>`;
    }
    if (t.status !== 'dibatalkan') {
      actions += `<button class="btn btn-label" onclick="openLabelSheet(${t.id})">Label</button>`;
    }

    return `<tr>
      <td>
        <div class="td-nomor"><a href="/order/detail?id=${t.id}">${escHtml(t.nomor_transaksi)}</a></div>
        <div class="td-meta">${escHtml(t.kasir_nama || '—')}</div>
      </td>
      <td>
        <div>${escHtml(t.pelanggan_nama || 'Non-member')}</div>
        ${telDisplay ? `<div class="td-meta">${escHtml(telDisplay)}</div>` : ''}
      </td>
      <td><div style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px" title="${escHtml(t.layanan_ringkas || '')}">${escHtml(t.layanan_ringkas || '—')}</div></td>
      <td style="font-weight:700;white-space:nowrap">${fmtRp(t.total_bayar)}</td>
      <td>
        ${badgePay}
        ${!lunas ? `<div class="td-meta">Sisa ${fmtRp(t.total_bayar - t.bayar)}</div>` : ''}
      </td>
      <td>
        ${badgeStatus}
        ${lewat ? `<div class="td-meta" style="color:#EF4444;font-weight:700">Lewat Waktu</div>` : ''}
      </td>
      <td style="white-space:nowrap;font-size:12px">${fmtDate(t.tanggal_masuk)}</td>
      <td style="white-space:nowrap;font-size:12px">
        <div>${fmtDate(selesaiDate)}</div>
        <div class="td-meta">${selesaiLabel}</div>
      </td>
      <td class="td-actions-cell">${actions}</td>
    </tr>`;
  }).join('');
}

function renderPagination(total) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  let html = `<button class="pg-btn" onclick="loadOrders(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} aria-label="Sebelumnya">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>`;
  const start = Math.max(1, currentPage - 2);
  const end   = Math.min(totalPages, currentPage + 2);
  if (start > 1) html += `<button class="pg-btn" onclick="loadOrders(1)">1</button>`;
  if (start > 2) html += `<span style="padding:0 4px;color:#94A3B8">…</span>`;
  for (let p = start; p <= end; p++) {
    html += `<button class="pg-btn ${p === currentPage ? 'active' : ''}" onclick="loadOrders(${p})">${p}</button>`;
  }
  if (end < totalPages - 1) html += `<span style="padding:0 4px;color:#94A3B8">…</span>`;
  if (end < totalPages) html += `<button class="pg-btn" onclick="loadOrders(${totalPages})">${totalPages}</button>`;
  html += `<button class="pg-btn" onclick="loadOrders(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} aria-label="Berikutnya">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>`;
  el.innerHTML = html;
}

async function updateStatus(id, status, btn) {
  btn.disabled = true;
  try {
    const r = await fetch(`/api/v1/transaksi/${id}/status`, {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error); return; }
    showToast('Ditandai ' + status);
    loadOrders(currentPage);
  } catch { showToast('Koneksi gagal'); }
  finally { btn.disabled = false; }
}

document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    quickFilter = p.dataset.quick;
    loadOrders(1);
  });
});

const urlParams = new URLSearchParams(location.search);
const qpParam = urlParams.get('quick') || urlParams.get('status');
if (qpParam && ['semua','aktif','selesai','selesai_hari_ini','lewat'].includes(qpParam)) {
  quickFilter = qpParam;
  document.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x.dataset.quick === qpParam));
}

window.addEventListener('lunasi:done', () => {
  showToast('Pembayaran tersimpan');
  loadOrders(currentPage);
});

loadOrders(1);
</script>

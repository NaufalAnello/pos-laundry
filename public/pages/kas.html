<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>Buku Kas — POS Laundry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }

    .pos-topbar { display: none !important; }

    /* ── Header ─────────────────────────────────────────── */
    .kas-head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .kas-head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .kas-title { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }
    .btn-add {
      height: 36px; padding: 0 14px; border: none; border-radius: 8px;
      background: #2D3BB5; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-add:active { transform: scale(.97); }

    .body-wrap {
      padding: 4px 16px 130px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* ── Hero card (gradient biru) ─────────────────────── */
    .hero-card {
      background: linear-gradient(135deg, #2D3BB5 0%, #2563EB 100%);
      color: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.20);
    }
    .hero-title-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; opacity: 0.85; color: #fff;
    }
    .hero-per { font-size: 11px; opacity: 0.75; color: #fff; }
    .hero-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .hero-cell {
      display: flex; flex-direction: column; gap: 2px;
    }
    .hero-cell .lbl {
      font-size: 11px; opacity: 0.85;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .hero-cell .val { font-size: 16px; font-weight: 800; line-height: 1.1; }
    .hero-cell .val.in { color: #BBF7D0; }
    .hero-cell .val.out { color: #FECACA; }

    /* ── Filter pills (Semua / Masuk / Keluar) ─────────── */
    .pills-jenis { display: flex; gap: 6px; }
    .pill-j {
      flex: 1; height: 36px; border-radius: 999px;
      border: 1px solid #E2E8F0; background: #fff;
      font-size: 12px; font-weight: 600; cursor: pointer;
      color: #64748B; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .pill-j:active { transform: scale(.97); }
    .pill-j.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }

    /* ── Periode pills (scroll) ────────────────────────── */
    .pills-per { display: flex; gap: 6px; overflow-x: auto; }
    .pills-per::-webkit-scrollbar { display: none; }
    .pill-p {
      flex-shrink: 0; padding: 0 14px; height: 32px; border-radius: 999px;
      border: 1px solid #E2E8F0; background: #fff;
      font-size: 12px; font-weight: 600; color: #64748B;
      cursor: pointer; font-family: inherit;
    }
    .pill-p.active { background: #E3F2FF; color: #2563EB; border-color: #2563EB; }

    /* ── Custom range popup ────────────────────────────── */
    .custom-range {
      display: none; background: #fff; border-radius: 10px; padding: 12px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .custom-range.open { display: block; }
    .custom-range .row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;
    }
    .custom-range label {
      display: block; font-size: 11px; font-weight: 700; color: #64748B;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px;
    }
    .custom-range input {
      width: 100%; height: 40px; padding: 0 10px;
      border: 1px solid #E2E8F0; border-radius: 8px;
      font-size: 14px; font-family: inherit; background: #fff; color: #1E2A6E;
      outline: none;
    }
    .custom-range input:focus { border-color: #2D3BB5; }
    .custom-range .actions { display: flex; gap: 6px; }
    .custom-range .actions button {
      flex: 1; height: 38px; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
      border: 1px solid transparent;
    }
    .custom-range .btn-apply { background: #2D3BB5; color: #fff; }
    .custom-range .btn-reset { background: #fff; border-color: #E2E8F0; color: #64748B; }

    .info-line { font-size: 12px; color: #64748B; padding: 0 2px; }

    /* ── List ──────────────────────────────────────────── */
    .list-wrap { display: flex; flex-direction: column; gap: 8px; }
    .day-label {
      font-size: 11px; font-weight: 800; color: #64748B;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 8px 2px 2px;
    }
    .day-label:first-child { padding-top: 0; }

    /* ── Row transaksi ─────────────────────────────────── */
    .kas-row {
      background: #fff; border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      cursor: pointer; transition: background .12s;
    }
    .kas-row:hover, .kas-row.expanded { background: #F8FAFF; }
    .kas-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .kas-left { flex: 1; min-width: 0; }
    .kas-ket {
      font-size: 14px; font-weight: 600; color: #1E2A6E;
      line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .kas-meta {
      display: flex; align-items: center; gap: 6px; margin-top: 3px;
      flex-wrap: wrap;
    }
    .kas-meta .sub { font-size: 11px; color: #94A3B8; }
    .kas-jml {
      font-size: 14px; font-weight: 800; white-space: nowrap; text-align: right;
      flex-shrink: 0;
    }
    .kas-jml.masuk { color: #10B981; }
    .kas-jml.keluar { color: #EF4444; }

    /* ── Badge sumber ─────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .3px;
      white-space: nowrap;
    }
    .badge-auto { background: #E3F2FF; color: #2563EB; }
    .badge-manual { background: #F1F5F9; color: #64748B; }

    /* Expand detail */
    .kas-detail {
      display: none;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed #E2E8F0;
      font-size: 12px; color: #64748B;
    }
    .kas-row.expanded .kas-detail { display: block; }
    .kas-detail .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0;
    }
    .kas-detail .row .lbl { color: #94A3B8; }
    .kas-detail .row .val { color: #1E2A6E; font-weight: 600; }
    .kas-detail .row .val a { color: #2D3BB5; text-decoration: none; font-weight: 700; }

    .kas-actions {
      display: flex; gap: 6px; margin-top: 10px;
    }
    .kas-actions button {
      flex: 1; height: 36px; padding: 0 10px;
      border-radius: 8px; border: 1px solid #E2E8F0;
      background: #fff; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; color: #64748B;
    }
    .kas-actions .btn-edit:hover { background: #E3F2FF; color: #2D3BB5; border-color: #2D3BB5; }
    .kas-actions .btn-del { border-color: #FDECEC; color: #EF4444; }
    .kas-actions .btn-del:hover { background: #FDECEC; }

    /* ── Empty state ───────────────────────────────────── */
    .empty {
      text-align: center; padding: 40px 20px; color: #94A3B8;
      background: #fff; border-radius: 10px; border: 1px dashed #E2E8F0;
    }
    .empty .ttl-em { font-size: 15px; font-weight: 700; color: #64748B; margin-bottom: 12px; }
    .empty .btn-first {
      height: 40px; padding: 0 18px; border-radius: 8px; border: none;
      background: #2D3BB5; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }

    /* ── Load more ─────────────────────────────────────── */
    .load-more-wrap { text-align: center; margin-top: 6px; }
    .btn-more {
      height: 38px; padding: 0 18px; border-radius: 8px;
      border: 1px solid #E2E8F0; background: #fff;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      color: #64748B;
    }

    /* ── Bottom sheet form ─────────────────────────────── */
    .lm-bg {
      position: fixed !important; inset: 0 !important; background: rgba(30,42,110,0.45) !important;
      z-index: 9999 !important; display: none; align-items: flex-end; justify-content: center;
      padding: 0; overflow-y: auto;
    }
    .lm-bg.open { display: flex !important; }
    .lm {
      position: relative; background: #fff; border-radius: 18px 18px 0 0;
      width: 100%; max-width: 100%; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 -8px 32px rgba(45,59,181,.18);
    }
    .lm-h {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid #E2E8F0;
      position: sticky; top: 0; background: #fff; z-index: 2;
    }
    .lm-h h3 { font-size: 16px; font-weight: 800; color: #1E2A6E; }
    .lm-h .x {
      width: 32px; height: 32px; border-radius: 8px;
      background: #F1F5F9; border: none; cursor: pointer; color: #64748B;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .lm-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
    .lm-f {
      padding: 12px 18px; border-top: 1px solid #E2E8F0;
      display: flex; gap: 8px; position: sticky; bottom: 0; background: #fff;
    }
    .lm-f .btn { flex: 1; min-height: 44px; }

    /* ── Form fields ───────────────────────────────────── */
    .fld label {
      display: block; font-size: 12px; font-weight: 700;
      color: #64748B; margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: .3px;
    }
    .fld input, .fld textarea, .fld select {
      width: 100%; padding: 10px 12px; border: 1.5px solid #E2E8F0;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: #fff; color: #1E2A6E; outline: none;
      min-height: 44px;
    }
    .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: #2D3BB5; }

    /* ── Jenis toggle (form) ───────────────────────────── */
    .jenis-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      border: 1px solid #E2E8F0; border-radius: 10px; overflow: hidden;
    }
    .jenis-grp button {
      padding: 12px; border: none; background: #fff;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      color: #94A3B8;
    }
    .jenis-grp button.active.in { background: #10B981; color: #fff; }
    .jenis-grp button.active.out { background: #EF4444; color: #fff; }

    /* ── Buttons (sheet footer) ────────────────────────── */
    .btn {
      padding: 10px 16px; border-radius: 8px; border: 1px solid transparent;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-primary { background: #2D3BB5; color: #fff; }
    .btn-outline { background: #fff; border-color: #E2E8F0; color: #64748B; }
    .btn:disabled { opacity: .5; cursor: default; }

    /* ── Toast ─────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1E2A6E; color: #fff; padding: 10px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 99999;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #toast.show { opacity: 1; }

    /* ══ DESKTOP ══ */
    .desktop-only { display: none; }
    .mobile-only { display: block; }

    @media (min-width: 1024px) {
      .desktop-only { display: block; }
      .mobile-only { display: none; }
      .body-wrap { padding: 4px 20px 40px; }
      .kas-head { padding: 16px 20px 10px; }
      .kas-title { font-size: 22px; }

      .hero-grid { gap: 20px; }
      .hero-cell .val { font-size: 22px; }

      .table-card {
        background: #fff; border-radius: 12px;
        overflow: hidden; box-shadow: 0 1px 3px rgba(45,59,181,.08);
      }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 800px; }
      thead th {
        padding: 12px 14px; text-align: left; font-size: 11px; font-weight: 800;
        text-transform: uppercase; letter-spacing: .4px; color: #64748B;
        background: #F8FAFF; border-bottom: 1px solid #E2E8F0;
      }
      thead th.right { text-align: right; }
      tbody tr { border-bottom: 1px solid #F1F5F9; }
      tbody tr:last-child { border-bottom: none; }
      tbody tr:hover { background: #F8FAFF; }
      tbody td { padding: 11px 14px; vertical-align: middle; font-size: 13px; color: #1E2A6E; }
      tbody td.right { text-align: right; font-weight: 700; }
      tbody td.in { color: #10B981; }
      tbody td.out { color: #EF4444; }

      .td-actions { display: flex; gap: 6px; justify-content: flex-end; }
      .td-actions button {
        min-width: 34px; height: 34px; padding: 0 10px; border-radius: 6px;
        border: 1px solid #E2E8F0; background: #fff;
        font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
        color: #64748B;
      }
      .td-actions .btn-edit:hover { background: #E3F2FF; color: #2D3BB5; border-color: #2D3BB5; }
      .td-actions .btn-del { border-color: #FDECEC; color: #EF4444; }
      .td-actions .btn-del:hover { background: #FDECEC; }

      .lm-bg { align-items: center; padding: 16px; }
      .lm { max-width: 480px; border-radius: 14px; }
    }
  </style>
</head>
<body>

<div class="page">
  <!-- HEADER -->
  <div class="kas-head">
    <a class="ic-btn" href="/dashboard" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="kas-title">Buku Kas</div>
    <button class="btn-add" onclick="openSheet()" aria-label="Tambah transaksi">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Tambah</span>
    </button>
  </div>

  <div class="body-wrap">
    <!-- HERO -->
    <div class="hero-card">
      <div class="hero-title-row">
        <div class="hero-title">Ringkasan Kas</div>
        <div class="hero-per" id="heroPeriode"></div>
      </div>
      <div class="hero-grid">
        <div class="hero-cell">
          <div class="lbl">Masuk</div>
          <div class="val in" id="heroMasuk">—</div>
        </div>
        <div class="hero-cell">
          <div class="lbl">Keluar</div>
          <div class="val out" id="heroKeluar">—</div>
        </div>
        <div class="hero-cell">
          <div class="lbl">Bersih</div>
          <div class="val" id="heroSaldo">—</div>
        </div>
      </div>
    </div>

    <!-- PILL PERIODE -->
    <div class="pills-per" id="pillPeriode">
      <button class="pill-p active" data-periode="hari" onclick="setPeriode('hari', this)">Hari Ini</button>
      <button class="pill-p" data-periode="7hari" onclick="setPeriode('7hari', this)">7 Hari</button>
      <button class="pill-p" data-periode="bulan" onclick="setPeriode('bulan', this)">Bulan Ini</button>
      <button class="pill-p" data-periode="custom" onclick="setPeriode('custom', this)">Custom</button>
    </div>

    <!-- CUSTOM RANGE -->
    <div class="custom-range" id="customRange">
      <div class="row">
        <div>
          <label>Dari</label>
          <input type="date" id="customDari"/>
        </div>
        <div>
          <label>Sampai</label>
          <input type="date" id="customSampai"/>
        </div>
      </div>
      <div class="actions">
        <button class="btn-reset" onclick="resetCustom()">Reset</button>
        <button class="btn-apply" onclick="applyCustom()">Terapkan</button>
      </div>
    </div>

    <!-- FILTER JENIS -->
    <div class="pills-jenis" id="pillJenis">
      <button class="pill-j active" data-jenis="" onclick="setJenisFilter('', this)">Semua</button>
      <button class="pill-j" data-jenis="masuk" onclick="setJenisFilter('masuk', this)">Masuk</button>
      <button class="pill-j" data-jenis="keluar" onclick="setJenisFilter('keluar', this)">Keluar</button>
    </div>

    <div class="info-line" id="infoLine"></div>

    <!-- MOBILE list -->
    <div class="mobile-only">
      <div class="list-wrap" id="cardList">
        <div class="empty"><div class="ttl-em">Memuat…</div></div>
      </div>
    </div>

    <!-- DESKTOP table -->
    <div class="desktop-only">
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Keterangan</th>
                <th>Sumber</th>
                <th class="right">Nominal</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" style="text-align:center;padding:40px;color:#94A3B8">Memuat…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="btn-more" onclick="loadMore()">Muat lebih banyak</button>
    </div>
  </div>
</div>

<!-- ── Bottom sheet form ────────────────────────────── -->
<div class="lm-bg" id="sheetForm">
  <div class="lm">
    <div class="lm-h">
      <h3 id="sheetTitle">Tambah Transaksi</h3>
      <button class="x" onclick="closeSheet()" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>
    <div class="lm-b">
      <div class="fld">
        <label>Jenis Transaksi</label>
        <div class="jenis-grp">
          <button type="button" id="jenisIn" class="in active" onclick="setFormJenis('masuk')">Masuk</button>
          <button type="button" id="jenisOut" class="out" onclick="setFormJenis('keluar')">Keluar</button>
        </div>
      </div>
      <div class="fld">
        <label>Keterangan</label>
        <input type="text" id="formKeterangan" placeholder="Mis: Beli deterjen, gaji, dll." maxlength="255"/>
      </div>
      <div class="fld">
        <label>Nominal (Rp)</label>
        <input type="number" id="formJumlah" placeholder="0" min="1" inputmode="numeric"/>
      </div>
      <div class="fld">
        <label>Tanggal</label>
        <input type="date" id="formTanggal"/>
      </div>
      <div class="fld">
        <label>Kategori</label>
        <select id="formKategori">
          <option value="lainnya">Lainnya</option>
          <option value="operasional">Operasional</option>
          <option value="bahan">Bahan/Supplies</option>
          <option value="gaji">Gaji</option>
          <option value="peralatan">Peralatan</option>
          <option value="tagihan">Tagihan/Utilitas</option>
          <option value="transaksi">Transaksi</option>
        </select>
      </div>
    </div>
    <div class="lm-f">
      <button class="btn btn-outline" onclick="closeSheet()">Batal</button>
      <button class="btn btn-primary" id="btnSimpan" onclick="simpanKas()">Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const fmtRp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const fmtRpShort = n => {
  n = Number(n || 0);
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n >= 1_000_000) s = 'Rp ' + (n / 1_000_000).toFixed(1).replace('.0','') + 'jt';
  else if (n >= 1_000) s = 'Rp ' + Math.round(n / 1_000) + 'rb';
  else s = 'Rp ' + n.toLocaleString('id-ID');
  return neg ? '-' + s : s;
};
const fmtDateLong = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('id-ID',
  { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '—';
const fmtDateShort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('id-ID',
  { day:'2-digit', month:'short', year:'numeric' }) : '—';
const fmtTime = s => {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── State ─────────────────────────────────────────────────
let state = {
  periode: 'hari',
  dari: '',
  sampai: '',
  jenis: '',
  jenisForm: 'masuk',
  editId: null,
  page: 1
};
let allRows = [];
const PAGE_SIZE = 50;
let totalRows = 0;

function showToast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── Periode pills ─────────────────────────────────────────
function computePeriodeRange(p) {
  const today = new Date();
  const ymd = d => d.toISOString().slice(0, 10);
  const todayStr = ymd(today);
  if (p === 'hari') return { dari: todayStr, sampai: todayStr, label: 'Hari Ini' };
  if (p === '7hari') {
    const d = new Date(today); d.setDate(d.getDate() - 6);
    return { dari: ymd(d), sampai: todayStr, label: '7 Hari Terakhir' };
  }
  if (p === 'bulan') {
    const bulanAwal = todayStr.slice(0, 7) + '-01';
    return { dari: bulanAwal, sampai: todayStr, label: 'Bulan Ini' };
  }
  return { dari: '', sampai: '', label: '' };
}

function setPeriode(p, btn) {
  document.querySelectorAll('#pillPeriode .pill-p').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.periode = p;

  const cr = document.getElementById('customRange');
  if (p === 'custom') {
    cr.classList.add('open');
    if (!document.getElementById('customDari').value) {
      const r = computePeriodeRange('bulan');
      document.getElementById('customDari').value = r.dari;
      document.getElementById('customSampai').value = r.sampai;
    }
    return;
  }
  cr.classList.remove('open');

  const r = computePeriodeRange(p);
  state.dari = r.dari;
  state.sampai = r.sampai;
  reload();
}

function applyCustom() {
  const dari = document.getElementById('customDari').value;
  const sampai = document.getElementById('customSampai').value;
  if (!dari || !sampai) { showToast('Tanggal wajib diisi'); return; }
  if (dari > sampai) { showToast('Tanggal "Dari" harus ≤ "Sampai"'); return; }
  state.dari = dari;
  state.sampai = sampai;
  reload();
}
function resetCustom() {
  document.getElementById('customDari').value = '';
  document.getElementById('customSampai').value = '';
  state.dari = '';
  state.sampai = '';
  reload();
}

function setJenisFilter(j, btn) {
  document.querySelectorAll('#pillJenis .pill-j').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.jenis = j;
  reload();
}

function reload() {
  state.page = 1;
  loadList();
}

// ── Periode label di hero ─────────────────────────────────
function updateHeroLabel() {
  const el = document.getElementById('heroPeriode');
  if (state.periode === 'custom' && state.dari && state.sampai) {
    el.textContent = `${fmtDateShort(state.dari)} – ${fmtDateShort(state.sampai)}`;
  } else if (state.periode !== 'custom') {
    const r = computePeriodeRange(state.periode);
    el.textContent = r.label || '';
  } else {
    el.textContent = '';
  }
}

// ── Load list + ringkasan periode ────────────────────────
async function loadList() {
  const isFirst = state.page === 1;
  if (isFirst) {
    allRows = [];
    document.getElementById('cardList').innerHTML = '<div class="empty"><div class="ttl-em">Memuat…</div></div>';
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#94A3B8">Memuat…</td></tr>';
  }

  const params = new URLSearchParams({ page: state.page, limit: PAGE_SIZE });
  if (state.dari) params.set('tanggal_dari', state.dari);
  if (state.sampai) params.set('tanggal_sampai', state.sampai);
  if (state.jenis) params.set('jenis', state.jenis);

  try {
    const r = await fetch('/api/v1/kas?' + params);
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    allRows = isFirst ? d.data : [...allRows, ...d.data];
    totalRows = d.meta?.total || 0;

    renderMobile(allRows);
    renderTable(allRows);
    updateHeroFromList();
    updateHeroLabel();

    const infoEl = document.getElementById('infoLine');
    const moreEl = document.getElementById('loadMoreWrap');
    infoEl.textContent = totalRows > 0
      ? `Menampilkan ${allRows.length} dari ${totalRows} entri`
      : '';
    moreEl.style.display = (allRows.length < totalRows) ? 'block' : 'none';
  } catch (e) {
    console.error(e);
    document.getElementById('cardList').innerHTML = '<div class="empty"><div class="ttl-em">Gagal memuat data</div></div>';
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#EF4444">Gagal memuat data</td></tr>';
  }
}

function loadMore() { state.page++; loadList(); }

// ── Ringkasan dari hasil list (sudah ter-filter periode) ──
function updateHeroFromList() {
  if (totalRows > allRows.length) {
    fetchAgregat();
    return;
  }
  let masuk = 0, keluar = 0;
  allRows.forEach(r => {
    if (r.jenis === 'masuk') masuk += Number(r.jumlah);
    if (r.jenis === 'keluar') keluar += Number(r.jumlah);
  });
  applyHero(masuk, keluar);
}

async function fetchAgregat() {
  const params = new URLSearchParams({ page: 1, limit: 10000 });
  if (state.dari) params.set('tanggal_dari', state.dari);
  if (state.sampai) params.set('tanggal_sampai', state.sampai);
  try {
    const r = await fetch('/api/v1/kas?' + params);
    const d = await r.json();
    let masuk = 0, keluar = 0;
    (d.data || []).forEach(row => {
      if (row.jenis === 'masuk') masuk += Number(row.jumlah);
      if (row.jenis === 'keluar') keluar += Number(row.jumlah);
    });
    applyHero(masuk, keluar);
  } catch { /* keep fallback */ }
}

function applyHero(masuk, keluar) {
  const saldo = masuk - keluar;
  document.getElementById('heroMasuk').textContent = '+' + fmtRpShort(masuk);
  document.getElementById('heroKeluar').textContent = '-' + fmtRpShort(keluar);
  const heroSaldoEl = document.getElementById('heroSaldo');
  heroSaldoEl.textContent = (saldo >= 0 ? '' : '-') + fmtRpShort(Math.abs(saldo));
}

// ── Render: mobile cards ──────────────────────────────────
function renderMobile(rows) {
  const el = document.getElementById('cardList');
  if (!rows.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="ttl-em">Belum ada transaksi kas</div>
        <button class="btn-first" onclick="openSheet()">+ Tambah Transaksi Pertama</button>
      </div>`;
    return;
  }

  const groups = {};
  rows.forEach(r => {
    const tgl = (r.tanggal || '').slice(0, 10) || '?';
    if (!groups[tgl]) groups[tgl] = [];
    groups[tgl].push(r);
  });

  const html = Object.entries(groups).map(([tgl, items]) => {
    const itemsHtml = items.map(i => {
      const isAuto = !!i.transaksi_id;
      const sign = i.jenis === 'masuk' ? '+' : '-';
      const jenisCls = i.jenis === 'masuk' ? 'masuk' : 'keluar';
      const ket = i.keterangan || (i.nomor_transaksi ? 'Pelunasan ' + i.nomor_transaksi : '(tanpa keterangan)');
      const trxRow = i.nomor_transaksi
        ? `<div class="row"><span class="lbl">No. Transaksi</span><span class="val"><a href="/api/v1/transaksi/${i.transaksi_id}/struk" target="_blank">${esc(i.nomor_transaksi)}</a></span></div>`
        : '';
      const userRow = i.user_nama
        ? `<div class="row"><span class="lbl">Dicatat oleh</span><span class="val">${esc(i.user_nama)}</span></div>`
        : '';
      const actionsHtml = isAuto ? '' : `
        <div class="kas-actions">
          <button class="btn-edit" onclick="event.stopPropagation(); openEditSheet(${i.id})">Edit</button>
          <button class="btn-del" onclick="event.stopPropagation(); hapusKas(${i.id})">Hapus</button>
        </div>`;
      const badge = isAuto
        ? '<span class="badge badge-auto">Otomatis</span>'
        : '<span class="badge badge-manual">Manual</span>';

      const jam = fmtTime(i.created_at);

      return `
        <div class="kas-row" onclick="toggleExpand(this)">
          <div class="kas-top">
            <div class="kas-left">
              <div class="kas-ket">${esc(ket)}</div>
              <div class="kas-meta">
                ${jam ? `<span class="sub">${jam}</span>` : ''}
                ${badge}
              </div>
            </div>
            <div class="kas-jml ${jenisCls}">${sign}${fmtRp(i.jumlah)}</div>
          </div>
          <div class="kas-detail">
            <div class="row"><span class="lbl">Tanggal</span><span class="val">${fmtDateLong(tgl)}</span></div>
            <div class="row"><span class="lbl">Kategori</span><span class="val">${esc(i.kategori || '—')}</span></div>
            ${trxRow}
            ${userRow}
            ${actionsHtml}
          </div>
        </div>`;
    }).join('');

    return `<div class="day-label">${fmtDateLong(tgl)}</div>${itemsHtml}`;
  }).join('');

  el.innerHTML = html;
}

function toggleExpand(el) {
  el.classList.toggle('expanded');
}

// ── Render: desktop table ─────────────────────────────────
function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#94A3B8">Belum ada transaksi kas</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(i => {
    const isAuto = !!i.transaksi_id;
    const sign = i.jenis === 'masuk' ? '+' : '-';
    const cls = i.jenis === 'masuk' ? 'in' : 'out';
    const sumber = isAuto
      ? `<a href="/api/v1/transaksi/${i.transaksi_id}/struk" target="_blank" style="color:#2D3BB5;text-decoration:none;font-weight:700">${esc(i.nomor_transaksi || 'Otomatis')}</a> <span class="badge badge-auto">Otomatis</span>`
      : `<span class="badge badge-manual">Manual</span>${i.user_nama ? ' <span style="color:#94A3B8;font-size:11px">· ' + esc(i.user_nama) + '</span>' : ''}`;
    const aksi = isAuto ? '' : `
      <div class="td-actions">
        <button class="btn-edit" onclick="openEditSheet(${i.id})" title="Edit">Edit</button>
        <button class="btn-del" onclick="hapusKas(${i.id})" title="Hapus">Hapus</button>
      </div>`;
    return `<tr>
      <td>${fmtDateShort(i.tanggal?.slice(0,10))}</td>
      <td>${esc(i.keterangan || (i.nomor_transaksi ? 'Pelunasan ' + i.nomor_transaksi : '—'))}<div style="font-size:11px;color:#94A3B8;margin-top:2px">${esc(i.kategori || '')}</div></td>
      <td>${sumber}</td>
      <td class="right ${cls}">${sign} ${fmtRp(i.jumlah)}</td>
      <td>${aksi}</td>
    </tr>`;
  }).join('');
}

// ── Bottom sheet ──────────────────────────────────────────
function openSheet() {
  state.editId = null;
  document.getElementById('sheetTitle').textContent = 'Tambah Transaksi';
  setFormJenis('masuk');
  document.getElementById('formKeterangan').value = '';
  document.getElementById('formJumlah').value = '';
  document.getElementById('formKategori').value = 'lainnya';
  document.getElementById('formTanggal').value = new Date().toISOString().slice(0, 10);
  document.getElementById('sheetForm').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openEditSheet(id) {
  const row = allRows.find(r => r.id === id);
  if (!row) return;
  if (row.transaksi_id) { showToast('Entri otomatis tidak bisa diedit'); return; }
  state.editId = id;
  document.getElementById('sheetTitle').textContent = 'Edit Transaksi';
  setFormJenis(row.jenis);
  document.getElementById('formKeterangan').value = row.keterangan || '';
  document.getElementById('formJumlah').value = row.jumlah;
  document.getElementById('formKategori').value = row.kategori || 'lainnya';
  document.getElementById('formTanggal').value = (row.tanggal || '').slice(0, 10);
  document.getElementById('sheetForm').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  document.getElementById('sheetForm').classList.remove('open');
  document.body.style.overflow = '';
  state.editId = null;
}

document.getElementById('sheetForm').addEventListener('click', e => {
  if (e.target.id === 'sheetForm') closeSheet();
});

function setFormJenis(j) {
  state.jenisForm = j;
  document.getElementById('jenisIn').classList.toggle('active', j === 'masuk');
  document.getElementById('jenisOut').classList.toggle('active', j === 'keluar');
}

// ── Simpan / update ───────────────────────────────────────
async function simpanKas() {
  const tanggal = document.getElementById('formTanggal').value;
  const jumlah = parseFloat(document.getElementById('formJumlah').value);
  const kategori = document.getElementById('formKategori').value;
  const keterangan = document.getElementById('formKeterangan').value.trim();

  if (!tanggal) { showToast('Tanggal wajib diisi'); return; }
  if (!jumlah || jumlah < 1) { showToast('Nominal harus > 0'); return; }

  const btn = document.getElementById('btnSimpan');
  btn.disabled = true;
  try {
    const url = state.editId ? `/api/v1/kas/${state.editId}` : '/api/v1/kas';
    const method = state.editId ? 'PUT' : 'POST';
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tanggal, jenis: state.jenisForm, kategori, keterangan, jumlah })
    });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + (d.error || 'tidak diketahui')); return; }
    showToast(d.message || 'Tersimpan');
    closeSheet();
    reload();
  } catch {
    showToast('Koneksi gagal');
  } finally {
    btn.disabled = false;
  }
}

// ── Hapus ─────────────────────────────────────────────────
async function hapusKas(id) {
  if (!confirm('Hapus transaksi kas ini?')) return;
  try {
    const r = await fetch(`/api/v1/kas/${id}`, { method: 'DELETE' });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + (d.error || '')); return; }
    showToast(d.message || 'Dihapus');
    reload();
  } catch {
    showToast('Koneksi gagal');
  }
}

// ── Init ──────────────────────────────────────────────────
(function init() {
  const r = computePeriodeRange('hari');
  state.dari = r.dari;
  state.sampai = r.sampai;
  loadList();
})();
</script>

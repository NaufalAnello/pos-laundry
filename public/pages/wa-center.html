<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>Pusat WA — POS Laundry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }
    .pos-topbar { display: none !important; }

    /* ── Header ─────────────────────────────────── */
    .wa-head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .wa-head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .wa-title { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }

    /* ── Body ─────────────────────────────────── */
    .body-wrap {
      padding: 4px 16px 130px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* ── Segmented tabs (spek) ─────────────────── */
    .tabs {
      display: flex; gap: 3px; padding: 3px;
      background: #E2E8F0; border-radius: 10px;
    }
    .tab {
      flex: 1; height: 36px; border: none; background: transparent;
      color: #64748B; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; border-radius: 8px;
    }
    .tab.active { background: #fff; color: #2D3BB5; box-shadow: 0 1px 2px rgba(45,59,181,0.08); }

    /* ── WA mode ────────────────────────────────── */
    .wa-mode {
      display: flex; gap: 3px; padding: 3px;
      background: #E2E8F0; border-radius: 10px;
    }
    .wa-mode-btn {
      flex: 1; height: 34px; border: none; background: transparent;
      color: #64748B; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; border-radius: 8px;
    }
    .wa-mode-btn.active { background: #fff; color: #2D3BB5; box-shadow: 0 1px 2px rgba(45,59,181,0.08); }

    /* ── Tab section ────────────────────────────── */
    .tab-sec { display: none; }
    .tab-sec.active { display: flex; flex-direction: column; gap: 12px; }

    .section-ttl {
      font-size: 12px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: .8px;
      padding: 0 2px;
    }

    /* ── Tagihan row ────────────────────────────── */
    .tag-card {
      background: #fff; border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .tag-info { min-width: 0; flex: 1; }
    .tag-head {
      font-size: 14px; font-weight: 600; color: #1E2A6E;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tag-head .nomor { color: #2D3BB5; font-weight: 700; margin-left: 4px; }
    .tag-sub {
      display: flex; align-items: center; gap: 6px; margin-top: 3px;
      font-size: 12px; color: #94A3B8;
    }
    .tag-sisa { color: #EF4444; font-weight: 700; font-size: 12px; }
    .btn-tagih {
      height: 36px; padding: 0 14px; border-radius: 8px; border: none;
      background: #2D3BB5; color: #fff; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; flex-shrink: 0;
    }
    .btn-tagih:active { transform: scale(.97); }

    /* ── Broadcast cards ───────────────────────── */
    .card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* Group pills */
    .group-pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .group-pills::-webkit-scrollbar { display: none; }
    .g-pill {
      flex: 1 0 auto; min-width: 0; height: 36px; padding: 0 14px;
      border-radius: 999px; border: 1px solid #E2E8F0; background: #fff;
      color: #64748B; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .g-pill.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }

    /* Template chips */
    .tpl-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .tpl-row::-webkit-scrollbar { display: none; }
    .tpl-chip {
      flex-shrink: 0; padding: 0 14px; height: 32px;
      border: 1px solid #E2E8F0; background: #fff;
      color: #64748B; font-size: 12px; font-weight: 600;
      border-radius: 999px; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center;
    }
    .tpl-chip.active { background: #E3F2FF; color: #2563EB; border-color: #2563EB; }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 12px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: .3px;
    }
    .field textarea, .field input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #E2E8F0;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      color: #1E2A6E; outline: none; background: #fff;
    }
    .field textarea { resize: vertical; min-height: 120px; }
    .field textarea:focus, .field input:focus { border-color: #2D3BB5; }

    .var-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .var-lbl { font-size: 11px; color: #94A3B8; font-weight: 600; }
    .var-chip {
      padding: 4px 10px; background: #E3F2FF; color: #2563EB;
      border-radius: 6px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: none; font-family: inherit;
    }
    .var-chip:hover { background: #2D3BB5; color: #fff; }

    /* Preview */
    .preview {
      background: #F8FAFF; border: 1px solid #E2E8F0; border-radius: 8px;
      padding: 12px 14px; font-size: 13px; color: #1E2A6E;
      white-space: pre-wrap; max-height: 200px; overflow-y: auto;
      line-height: 1.5;
    }
    .preview.empty { color: #94A3B8; font-style: italic; }
    .preview-h {
      font-size: 11px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: .4px;
    }

    .count-info {
      font-size: 13px; color: #1E2A6E; font-weight: 600;
      padding: 8px 12px; background: #E3F2FF; border-radius: 8px;
    }
    .count-info b { color: #2563EB; font-weight: 800; }

    /* Buttons */
    .btn {
      padding: 10px 16px; border-radius: 8px; border: 1px solid transparent;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: #2D3BB5; color: #fff; }
    .btn-wa { background: #10B981; color: #fff; }
    .btn-outline { background: #fff; border-color: #E2E8F0; color: #64748B; }
    .btn-ghost { background: none; border: none; color: #64748B; }

    .btn-refresh {
      width: 40px; height: 36px; padding: 0; border-radius: 8px;
      border: 1px solid #E2E8F0; background: #fff; color: #64748B;
      cursor: pointer; font-family: inherit; display: inline-flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* Riwayat */
    .rw-item {
      display: flex; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid #F1F5F9;
    }
    .rw-item:last-child { border-bottom: none; }
    .rw-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #10B981; margin-top: 6px; flex-shrink: 0;
    }
    .rw-body { flex: 1; min-width: 0; }
    .rw-line1 {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 13px; font-weight: 700; color: #1E2A6E;
    }
    .rw-time { font-size: 11px; color: #94A3B8; font-weight: 600; white-space: nowrap; }
    .rw-line2 {
      font-size: 12px; color: #64748B; margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      line-clamp: 2;
    }

    /* Pagination */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; flex-wrap: wrap; padding: 8px 0 0;
      font-size: 12px; color: #94A3B8;
    }
    .pag-btns { display: flex; gap: 4px; }
    .pag-btn {
      min-width: 30px; height: 30px; padding: 0 8px;
      border: 1px solid #E2E8F0; border-radius: 6px;
      background: #fff; color: #64748B; cursor: pointer; font-size: 12px;
      font-family: inherit;
    }
    .pag-btn:hover:not(:disabled) { background: #F8FAFF; }
    .pag-btn:disabled { opacity: .4; cursor: default; }
    .pag-btn.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }

    .empty {
      text-align: center; padding: 40px 20px; color: #94A3B8;
      background: #fff; border-radius: 10px; border: 1px dashed #E2E8F0;
    }
    .empty .ttl-em { font-size: 15px; font-weight: 700; color: #64748B; margin-bottom: 4px; }
    .empty .sub { font-size: 13px; }

    /* ── Toast ─────────────────────────────────── */
    #toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1E2A6E; color: #fff; padding: 10px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 99999;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      max-width: calc(100vw - 32px); text-align: center;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: #EF4444; }

    /* ── Stepper modal ─────────────────────────── */
    .lm-bg {
      display: none; position: fixed !important; inset: 0 !important;
      background: rgba(30,42,110,0.45) !important; z-index: 9999 !important;
      align-items: flex-end; justify-content: center;
      padding: 0; overflow-y: auto;
    }
    .lm-bg.open { display: flex !important; }
    .lm {
      background: #fff; border-radius: 18px 18px 0 0;
      width: 100%; max-width: 100%; max-height: 92vh; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 -8px 32px rgba(45,59,181,.18);
    }
    .lm-h {
      background: linear-gradient(135deg, #2D3BB5 0%, #2563EB 100%);
      color: #fff; padding: 14px 18px;
    }
    .lm-h h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .lm-progress {
      height: 5px; background: rgba(255,255,255,.3);
      border-radius: 4px; overflow: hidden;
    }
    .lm-progress-bar { height: 100%; background: #fff; width: 0%; transition: width .3s; }
    .lm-b { padding: 18px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .lm-f {
      padding: 12px 18px; border-top: 1px solid #E2E8F0;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    }

    @media (min-width: 1024px) {
      .wa-head { padding: 16px 20px 10px; }
      .wa-title { font-size: 22px; }
      .body-wrap { padding: 4px 20px 40px; display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
      .body-wrap > .left-col { display: flex; flex-direction: column; gap: 12px; }
      .body-wrap > .right-col { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 80px; }
      .body-wrap > .right-col .card { max-height: calc(100vh - 120px); overflow-y: auto; }
      .lm-bg { align-items: center; padding: 16px; }
      .lm { max-width: 480px; border-radius: 14px; }
    }
    @media (max-width: 1023px) {
      .right-col { display: contents; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="wa-head">
    <a class="ic-btn" href="/dashboard" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="wa-title">Pusat WA</div>
  </div>

  <div class="body-wrap">
    <div class="left-col" style="display:flex;flex-direction:column;gap:12px">
      <!-- Mode WA -->
      <div class="wa-mode">
        <button class="wa-mode-btn" id="waModeRegular" onclick="setWAMode('regular')">WA Biasa</button>
        <button class="wa-mode-btn active" id="waModeBusiness" onclick="setWAMode('business')">WA Business</button>
      </div>

      <!-- Segmented tab (spek) -->
      <div class="tabs">
        <button class="tab active" data-tab="tagihan" onclick="switchTab('tagihan')">Tagihan</button>
        <button class="tab" data-tab="broadcast" onclick="switchTab('broadcast')">Broadcast</button>
      </div>

      <!-- ── TAB: Tagihan ── -->
      <div class="tab-sec active" id="sec-tagihan">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="section-ttl" style="flex:1">Order Belum Lunas</div>
          <button class="btn-refresh" onclick="loadTagihan()" aria-label="Refresh">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"/><path d="M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          </button>
        </div>
        <div id="tagihanBody" style="display:flex;flex-direction:column;gap:8px">
          <div class="empty"><div class="ttl-em">Memuat…</div></div>
        </div>
      </div>

      <!-- ── TAB: Broadcast ── -->
      <div class="tab-sec" id="sec-broadcast">
        <div class="card">
          <div class="field">
            <label>Template</label>
            <div class="tpl-row">
              <button class="tpl-chip active" data-tpl="custom" onclick="setTemplate('custom')">Custom</button>
              <button class="tpl-chip" data-tpl="promo" onclick="setTemplate('promo')">Promo</button>
              <button class="tpl-chip" data-tpl="pengingat" onclick="setTemplate('pengingat')">Pengingat</button>
              <button class="tpl-chip" data-tpl="ucapan" onclick="setTemplate('ucapan')">Ucapan</button>
            </div>
          </div>

          <div class="field">
            <label>Kirim ke Grup</label>
            <div class="group-pills" id="bcFilterChips">
              <button class="g-pill active" data-f="all" onclick="setBcFilter('all')">Semua</button>
              <button class="g-pill" data-f="bronze" onclick="setBcFilter('bronze')">Bronze</button>
              <button class="g-pill" data-f="silver" onclick="setBcFilter('silver')">Silver</button>
              <button class="g-pill" data-f="gold" onclick="setBcFilter('gold')">Gold</button>
              <button class="g-pill" data-f="platinum" onclick="setBcFilter('platinum')">Platinum</button>
            </div>
            <div class="count-info" id="bcCountWrap">Menghitung target…</div>
          </div>

          <div class="field">
            <label>Pesan</label>
            <textarea id="bcMsg" placeholder="Ketik pesan broadcast…" oninput="updatePreview()"></textarea>
            <div class="var-chips">
              <span class="var-lbl">Sisipkan variabel:</span>
              <button class="var-chip" onclick="insertVar('{nama}')">nama</button>
              <button class="var-chip" onclick="insertVar('{poin}')">poin</button>
              <button class="var-chip" onclick="insertVar('{level}')">level</button>
            </div>
          </div>

          <div class="field">
            <label>Preview Pesan</label>
            <div class="preview-h">Contoh untuk pelanggan pertama</div>
            <div class="preview empty" id="bcPreview">(Ketik pesan untuk melihat preview…)</div>
          </div>

          <button class="btn btn-primary" id="btnBroadcast" onclick="startBroadcast()">
            <span id="btnBroadcastLabel">Kirim Broadcast</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Riwayat -->
    <div class="right-col" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="section-ttl" style="flex:1">Riwayat Pesan</div>
        <button class="btn-refresh" onclick="loadLog(1)" aria-label="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"/><path d="M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        </button>
      </div>
      <div class="card">
        <div id="logBody" style="display:flex;flex-direction:column">
          <div class="empty" style="border:none;padding:20px 0"><div class="ttl-em">Memuat…</div></div>
        </div>
        <div class="pagination" id="logPagBar" style="display:none">
          <span id="logPagInfo"></span>
          <div class="pag-btns" id="logPagBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Broadcast Stepper Modal ── -->
<div class="lm-bg" id="stepperModal">
  <div class="lm">
    <div class="lm-h">
      <h3>Broadcast Pesan</h3>
      <div class="lm-progress">
        <div class="lm-progress-bar" id="stepperBar"></div>
      </div>
    </div>
    <div class="lm-b">
      <div style="font-size:16px;font-weight:800;color:#1E2A6E" id="stepName">–</div>
      <div style="font-size:12px;color:#94A3B8" id="stepPhone">–</div>
      <div class="preview" id="stepMsg" style="margin-top:8px"></div>
    </div>
    <div class="lm-f">
      <div style="font-size:13px;color:#64748B" id="stepCounter"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" onclick="stepperSkip()" style="min-height:40px;padding:6px 12px;font-size:13px">Lewati</button>
        <button class="btn btn-wa" id="stepSendBtn" onclick="stepperSend()" style="min-height:40px;padding:6px 14px;font-size:13px">Kirim WA</button>
        <button class="btn btn-ghost" onclick="stepperClose()" style="min-height:40px;padding:6px 12px;font-size:13px">Tutup</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Templates ─────────────────────────────────────────────────────────────────
const TEMPLATES = {
  custom: '',
  promo: `Halo {nama},

Ada promo spesial minggu ini di Nala Laundry:
- Cuci kiloan diskon 20%
- Free antar jemput untuk wilayah sekitar

Tunjukkan pesan ini ke kasir untuk klaim promo.

Terima kasih,
Nala Laundry`,
  pengingat: `Halo {nama},

Kami mengingatkan bahwa cucian Anda di Nala Laundry sudah siap diambil. Mohon dijemput agar tidak menumpuk di toko ya.

Terima kasih,
Nala Laundry`,
  ucapan: `Halo {nama},

Terima kasih sudah jadi pelanggan setia kami. Saldo poin Anda saat ini: {poin} (level {level}).

Salam,
Nala Laundry`
};

// ── State ─────────────────────────────────────────────────────────────────────
let logPage = 1, logTotal = 1;
let bcData = [];
let stepIdx = 0;
let bcMsg = '';
let waMode = 'business';
let bcFilter = 'all';
let bcCurrentCount = 0;

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-sec').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.getElementById('sec-' + tab).classList.add('active');
}

// ── WA Mode ───────────────────────────────────────────────────────────────────
function setWAMode(mode) {
  waMode = mode;
  document.getElementById('waModeRegular').classList.toggle('active', mode === 'regular');
  document.getElementById('waModeBusiness').classList.toggle('active', mode === 'business');
}

function buildWAUrl(telepon, teks, mode) {
  const clean = String(telepon).replace(/\D/g, '');
  const phone = clean.startsWith('62') ? clean
              : clean.startsWith('0') ? '62' + clean.slice(1)
              : '62' + clean;
  const enc = encodeURIComponent(teks);
  return mode === 'business'
    ? `https://api.whatsapp.com/send?phone=${phone}&text=${enc}`
    : `https://wa.me/${phone}?text=${enc}`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const m = await api('/api/v1/pengaturan/wa-mode');
    if (m.wa_mode) setWAMode(m.wa_mode);
  } catch {}
  loadTagihan();
  loadBcCount();
  loadLog(1);
})();

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}

// ── Tagihan ───────────────────────────────────────────────────────────────────
async function loadTagihan() {
  try {
    const { data } = await api('/api/v1/wa/tagihan');
    const el = document.getElementById('tagihanBody');
    if (!data.length) {
      el.innerHTML = `<div class="empty">
        <div class="ttl-em">Semua tagihan sudah lunas</div>
        <div class="sub">Tidak ada order yang perlu ditagih.</div>
      </div>`;
      return;
    }
    const today = new Date(); today.setHours(0,0,0,0);
    el.innerHTML = data.map(r => {
      const created = new Date(r.created_at || r.tanggal_terima || Date.now());
      const diffDays = Math.floor((today - created) / (1000 * 60 * 60 * 24));
      const ageTxt = diffDays <= 0 ? 'hari ini'
                  : diffDays === 1 ? '1 hari lalu'
                  : `${diffDays} hari lalu`;
      return `
        <div class="tag-card">
          <div class="tag-info">
            <div class="tag-head">
              ${esc(r.pelanggan_nama || 'Tanpa Nama')}
              <span class="nomor">· ${esc(r.nomor_transaksi || '')}</span>
            </div>
            <div class="tag-sub">
              <span class="tag-sisa">${rupiah(r.sisa_tagihan)}</span>
              <span>·</span>
              <span>${ageTxt}</span>
            </div>
          </div>
          <button class="btn-tagih" onclick="kirimTagihanWA(${r.id})">Tagih</button>
        </div>
      `;
    }).join('');
  } catch (e) {
    toast(e.message, true);
    document.getElementById('tagihanBody').innerHTML = `<div class="empty">
      <div class="ttl-em" style="color:#EF4444">Gagal memuat tagihan</div>
    </div>`;
  }
}

async function kirimTagihanWA(id) {
  try {
    const d = await api(`/api/v1/transaksi/${id}/wa/tagihan?mode=${waMode}`);
    if (!d.url) { toast('Tidak ada nomor WA', true); return; }
    window.open(d.url, '_blank');
    await fetch('/api/v1/wa/log', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        telepon: d.telepon, pesan: d.teks, transaksi_id: id,
        status:'terkirim', wa_mode: waMode
      })
    });
    toast(`WA tagihan dibuka untuk ${d.pelanggan}`);
    loadLog(1);
  } catch (e) { toast(e.message, true); }
}

// ── Broadcast ─────────────────────────────────────────────────────────────────
function setTemplate(key) {
  document.querySelectorAll('.tpl-chip').forEach(b => {
    b.classList.toggle('active', b.dataset.tpl === key);
  });
  if (key !== 'custom') {
    document.getElementById('bcMsg').value = TEMPLATES[key] || '';
  }
  updatePreview();
}

function setBcFilter(f) {
  bcFilter = f;
  document.querySelectorAll('.g-pill').forEach(c => {
    c.classList.toggle('active', c.dataset.f === f);
  });
  loadBcCount();
}

async function loadBcCount() {
  try {
    const { total } = await api('/api/v1/wa/broadcast', {
      method: 'POST',
      body: JSON.stringify({ pesan: 'x', level_filter: bcFilter })
    });
    bcCurrentCount = total || 0;
    document.getElementById('bcCountWrap').innerHTML =
      `<b>${bcCurrentCount}</b> pelanggan akan menerima pesan`;
    document.getElementById('btnBroadcastLabel').textContent =
      `Kirim ke ${bcCurrentCount} Pelanggan`;
  } catch {
    document.getElementById('bcCountWrap').textContent = 'Gagal menghitung target';
    document.getElementById('btnBroadcastLabel').textContent = 'Kirim Broadcast';
  }
}

function insertVar(v) {
  const ta = document.getElementById('bcMsg');
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + v + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + v.length;
  ta.focus();
  updatePreview();
}

function updatePreview() {
  const msg = document.getElementById('bcMsg').value.trim();
  const el = document.getElementById('bcPreview');
  if (!msg) {
    el.textContent = '(Ketik pesan untuk melihat preview…)';
    el.classList.add('empty');
    return;
  }
  el.classList.remove('empty');
  const resolved = msg
    .replace(/\{nama\}/g, 'Pelanggan')
    .replace(/\{poin\}/g, '1250')
    .replace(/\{level\}/g, 'Silver');
  el.textContent = resolved;
}

async function startBroadcast() {
  const pesan = document.getElementById('bcMsg').value.trim();
  if (!pesan) { toast('Isi pesan terlebih dahulu', true); return; }
  try {
    const res = await api('/api/v1/wa/broadcast', {
      method: 'POST',
      body: JSON.stringify({ pesan, level_filter: bcFilter, mode: waMode })
    });
    if (!res.data?.length) { toast('Tidak ada target broadcast', true); return; }
    bcData = res.data;
    bcMsg = pesan;
    stepIdx = 0;
    document.getElementById('stepperModal').classList.add('open');
    updateStepper();
  } catch (e) { toast(e.message, true); }
}

function updateStepper() {
  if (stepIdx >= bcData.length) {
    document.getElementById('stepperModal').classList.remove('open');
    toast(`Broadcast selesai. ${bcData.length} pesan diproses`);
    return;
  }
  const target = bcData[stepIdx];
  const p = target.pelanggan;
  const resolved = bcMsg
    .replace(/\{nama\}/g, p.nama || '')
    .replace(/\{poin\}/g, p.total_poin || 0)
    .replace(/\{level\}/g, getLevel(p.total_poin || 0));
  document.getElementById('stepName').textContent = p.nama;
  document.getElementById('stepPhone').textContent = p.telepon || '';
  document.getElementById('stepMsg').textContent = resolved;
  document.getElementById('stepCounter').textContent = `${stepIdx + 1} / ${bcData.length}`;
  document.getElementById('stepperBar').style.width = ((stepIdx / bcData.length) * 100) + '%';
  bcData[stepIdx]._resolved = resolved;
}

function stepperSend() {
  const target = bcData[stepIdx];
  const resolved = target._resolved || bcMsg;
  window.open(buildWAUrl(target.pelanggan.telepon, resolved, waMode), '_blank');
  fetch('/api/v1/wa/log', {
    method:'POST', credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      telepon: target.pelanggan.telepon, pesan: resolved,
      status:'terkirim', wa_mode: waMode
    })
  }).catch(() => {});
  stepIdx++;
  updateStepper();
  loadLog(1);
}

function stepperSkip() { stepIdx++; updateStepper(); }
function stepperClose() {
  document.getElementById('stepperModal').classList.remove('open');
  bcData = []; stepIdx = 0;
}

// ── Riwayat log ───────────────────────────────────────────────────────────────
async function loadLog(p) {
  logPage = p;
  try {
    const d = await api(`/api/v1/wa/log-list?page=${p}&limit=20`);
    const items = d.data;
    const el = document.getElementById('logBody');
    if (!items.length) {
      el.innerHTML = `<div class="empty" style="border:none;padding:20px 0">
        <div class="ttl-em">Belum ada riwayat WA</div>
        <div class="sub">Pesan yang dikirim akan muncul di sini.</div>
      </div>`;
      document.getElementById('logPagBar').style.display = 'none';
      return;
    }
    el.innerHTML = items.map(r => `
      <div class="rw-item">
        <div class="rw-dot"></div>
        <div class="rw-body">
          <div class="rw-line1">
            <span>${r.pelanggan_nama ? esc(r.pelanggan_nama) : (r.telepon ? esc(r.telepon) : '—')}</span>
            <span class="rw-time">${fmtDt(r.created_at)}</span>
          </div>
          <div class="rw-line2">${esc(r.pesan || '')}</div>
        </div>
      </div>
    `).join('');

    const bar = document.getElementById('logPagBar');
    bar.style.display = 'flex';
    logTotal = Math.ceil(d.meta.total / d.meta.limit) || 1;
    document.getElementById('logPagInfo').textContent =
      `${(p-1)*d.meta.limit+1}–${Math.min(p*d.meta.limit, d.meta.total)} / ${d.meta.total}`;

    let pbtns = `<button class="pag-btn" onclick="loadLog(${p-1})" ${p<=1?'disabled':''}>‹</button>`;
    for (let i = Math.max(1,p-2); i <= Math.min(logTotal,p+2); i++) {
      pbtns += `<button class="pag-btn${i===p?' active':''}" onclick="loadLog(${i})">${i}</button>`;
    }
    pbtns += `<button class="pag-btn" onclick="loadLog(${p+1})" ${p>=logTotal?'disabled':''}>›</button>`;
    document.getElementById('logPagBtns').innerHTML = pbtns;
  } catch (e) { toast(e.message, true); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function getLevel(poin) {
  if (poin >= 5000) return 'Platinum';
  if (poin >= 2000) return 'Gold';
  if (poin >= 500) return 'Silver';
  return 'Bronze';
}
function rupiah(n) { return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
function fmtDt(s) {
  if (!s) return '–';
  return new Date(s).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  el.classList.toggle('err', !!err);
  setTimeout(() => el.classList.remove('show'), 2500);
}

document.getElementById('stepperModal').addEventListener('click', e => {
  if (e.target.id === 'stepperModal') stepperClose();
});
</script>

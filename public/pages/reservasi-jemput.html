<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Jadwal Jemput — POS Laundry</title>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:#F0F7FF;color:#1E2A6E;font-size:14px;min-height:100vh}

    .page{max-width:1200px;margin:0 auto}

    .pos-topbar{display:none !important}

    /* ── Header ─────────────────────────────────── */
    .rj-head{
      position:sticky;top:0;z-index:20;
      background:#F0F7FF;
      padding:14px 16px 10px;
      display:flex;align-items:center;gap:10px;
    }
    .rj-head .ic-btn{
      width:40px;height:40px;border-radius:10px;
      background:#fff;color:#2D3BB5;
      border:none;cursor:pointer;flex-shrink:0;
      display:inline-flex;align-items:center;justify-content:center;
      text-decoration:none;
      box-shadow:0 1px 3px rgba(45,59,181,0.08);
    }
    .rj-title{flex:1;font-size:20px;font-weight:800;color:#1E2A6E;letter-spacing:-.01em}
    .btn-add{
      height:36px;padding:0 14px;border:none;border-radius:8px;
      background:#2D3BB5;color:#fff;font-size:13px;font-weight:700;
      cursor:pointer;font-family:inherit;
      display:inline-flex;align-items:center;gap:4px;
    }
    .btn-add:active{transform:scale(.97)}

    /* ── Filter pills ─────────────────────────── */
    .pill-row{
      display:flex;gap:6px;padding:0 16px 6px;
      overflow-x:auto;scrollbar-width:none;
    }
    .pill-row::-webkit-scrollbar{display:none}
    .pill{
      flex-shrink:0;padding:0 14px;height:36px;
      border:1px solid #E2E8F0;background:#fff;color:#64748B;
      border-radius:999px;font-size:12px;font-weight:600;
      cursor:pointer;white-space:nowrap;font-family:inherit;
      display:inline-flex;align-items:center;
    }
    .pill.active{background:#2D3BB5;color:#fff;border-color:#2D3BB5}

    .info-line{font-size:12px;color:#64748B;padding:0 18px 4px}

    /* ── List ─────────────────────────────────── */
    .list{padding:4px 16px 130px;display:flex;flex-direction:column;gap:10px}

    .card{
      background:#fff;border-radius:10px;padding:12px 14px;
      box-shadow:0 1px 3px rgba(45,59,181,0.08);
      display:flex;flex-direction:column;gap:8px;
    }
    .card.selesai{opacity:.75}
    .card.batal{opacity:.6}

    .c-row1{
      display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    }
    .c-nama{font-size:14px;font-weight:700;color:#1E2A6E;line-height:1.25}
    .c-tglJam{font-size:12px;font-weight:700;color:#2563EB;white-space:nowrap;flex-shrink:0}
    .c-alamat{font-size:13px;color:#64748B;line-height:1.4}
    .c-catatan{font-size:12px;color:#94A3B8;font-style:italic;line-height:1.4}
    .c-tel{font-size:12px;color:#94A3B8}

    .c-status{
      display:inline-flex;align-items:center;gap:4px;
      padding:2px 8px;border-radius:6px;
      font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
      align-self:flex-start;
    }
    .c-status.terjadwal{background:#E3F2FF;color:#2563EB}
    .c-status.selesai{background:#E7F8F1;color:#10B981}
    .c-status.batal{background:#F1F5F9;color:#94A3B8}

    .c-order-link{
      font-size:12px;color:#2D3BB5;text-decoration:none;font-weight:700;
    }
    .c-alasan{font-size:12px;color:#EF4444;font-style:italic}

    .c-act{display:flex;gap:6px}
    .c-act button, .c-act a{
      flex:1;height:36px;padding:0 10px;
      border-radius:8px;font-size:12px;font-weight:600;
      cursor:pointer;font-family:inherit;
      display:inline-flex;align-items:center;justify-content:center;gap:4px;
      text-decoration:none;
    }
    .btn-ok{background:#10B981;color:#fff;border:none}
    .btn-ok:active{transform:scale(.97)}
    .btn-edit{background:#fff;color:#64748B;border:1px solid #E2E8F0}
    .btn-del{background:#fff;color:#EF4444;border:1px solid #FDECEC}

    .empty{
      text-align:center;padding:40px 20px;color:#94A3B8;
      background:#fff;border-radius:10px;border:1px dashed #E2E8F0;
    }
    .empty .ttl{font-size:15px;font-weight:700;color:#64748B;margin-bottom:12px}
    .empty .btn-first{
      height:40px;padding:0 18px;border-radius:8px;border:none;
      background:#2D3BB5;color:#fff;font-size:13px;font-weight:700;
      cursor:pointer;font-family:inherit;
      display:inline-flex;align-items:center;gap:5px;
    }

    /* ── Toast ────────────────────────────────── */
    #toast{
      position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
      background:#1E2A6E;color:#fff;padding:10px 20px;border-radius:999px;
      font-size:13px;font-weight:600;z-index:99999;
      opacity:0;pointer-events:none;transition:opacity .25s;
    }
    #toast.show{opacity:1}
    #toast.err{background:#EF4444}

    /* ── Bottom sheet modal ────────────────────── */
    .lm-bg{
      position:fixed !important; inset:0 !important; background:rgba(30,42,110,0.45) !important;
      z-index:9999 !important; display:none;align-items:flex-end;justify-content:center;
      padding:0;overflow-y:auto;
    }
    .lm-bg.open{display:flex !important}
    .lm{
      position:relative;background:#fff;border-radius:18px 18px 0 0;
      width:100%;max-width:100%;max-height:92vh;overflow-y:auto;
      box-shadow:0 -8px 32px rgba(45,59,181,.18);
    }
    .lm-h{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;border-bottom:1px solid #E2E8F0;
      position:sticky;top:0;background:#fff;z-index:2;
    }
    .lm-h h3{font-size:16px;font-weight:800;color:#1E2A6E}
    .lm-x{
      width:32px;height:32px;border-radius:8px;
      background:#F1F5F9;border:none;cursor:pointer;color:#64748B;
      display:inline-flex;align-items:center;justify-content:center;
    }
    .lm-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
    .lm-f{
      padding:12px 18px;border-top:1px solid #E2E8F0;
      display:flex;gap:8px;position:sticky;bottom:0;background:#fff;
    }
    .lm-f button{
      flex:1;min-height:44px;padding:10px;border:none;border-radius:8px;
      font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    }
    .lm-f .cancel{background:#fff;border:1px solid #E2E8F0;color:#64748B}
    .lm-f .save{background:#2D3BB5;color:#fff}
    .lm-f button:disabled{opacity:.5;cursor:default}

    .field label{
      display:block;font-size:12px;font-weight:700;color:#64748B;
      margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;
    }
    .field input, .field textarea, .field select{
      width:100%;padding:10px 12px;border:1.5px solid #E2E8F0;
      border-radius:8px;font-size:14px;font-family:inherit;
      background:#fff;color:#1E2A6E;outline:none;min-height:44px;
    }
    .field input:focus, .field textarea:focus{border-color:#2D3BB5}
    .field textarea{min-height:60px;resize:vertical}

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    /* pelanggan picker */
    .pl-result{
      border:1px solid #E2E8F0;border-top:none;
      border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;
      background:#fff;display:none;
    }
    .pl-result.open{display:block}
    .pl-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #F1F5F9;font-size:13px}
    .pl-item:last-child{border-bottom:none}
    .pl-item:hover{background:#F8FAFF}
    .pl-selected{
      padding:10px 12px;background:#E3F2FF;border:1px solid #2563EB;
      border-radius:8px;margin-bottom:8px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .pl-selected .ttl{font-weight:700;color:#2563EB;font-size:13px}
    .pl-selected .meta{font-size:11px;color:#64748B;margin-top:2px}
    .pl-selected .xbtn{
      width:28px;height:28px;border-radius:6px;
      background:transparent;border:none;cursor:pointer;color:#EF4444;
      display:inline-flex;align-items:center;justify-content:center;
    }

    @media (min-width:1024px){
      .rj-head{padding:16px 20px 10px}
      .rj-title{font-size:22px}
      .pill-row{padding:0 20px 6px}
      .list{padding:4px 20px 40px}
      .lm-bg{align-items:center;padding:16px}
      .lm{max-width:520px;border-radius:14px}
    }
  </style>
</head>
<body>

<div class="page">
  <!-- HEADER -->
  <div class="rj-head">
    <a class="ic-btn" href="/dashboard" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="rj-title">Jadwal Jemput</div>
    <button class="btn-add" onclick="openForm()" aria-label="Tambah jadwal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Jadwal</span>
    </button>
  </div>

  <div class="pill-row">
    <button class="pill active" data-f="hari-ini" onclick="setFilter('hari-ini')">Hari Ini</button>
    <button class="pill" data-f="besok" onclick="setFilter('besok')">Besok</button>
    <button class="pill" data-f="minggu-ini" onclick="setFilter('minggu-ini')">Minggu Ini</button>
    <button class="pill" data-f="semua" onclick="setFilter('semua')">Semua</button>
    <button class="pill" data-f="selesai" onclick="setFilter('selesai')">Selesai</button>
  </div>

  <div class="info-line" id="subInfo">Memuat…</div>

  <div class="list" id="list">
    <div class="empty"><div class="ttl">Memuat…</div></div>
  </div>
</div>

<!-- Modal form -->
<div class="lm-bg" id="formModal">
  <div class="lm">
    <div class="lm-h">
      <h3 id="formTitle">Tambah Jadwal Jemput</h3>
      <button class="lm-x" onclick="closeForm()" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>
    <div class="lm-b">
      <div class="field">
        <label>Pelanggan *</label>
        <div id="plSelectedWrap"></div>
        <input type="text" id="plSearch" placeholder="Cari nama atau nomor telepon…" oninput="onSearchPelanggan()" autocomplete="off"/>
        <div class="pl-result" id="plResult"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Tanggal Jemput *</label>
          <input type="date" id="fTanggal"/>
        </div>
        <div class="field">
          <label>Jam (opsional)</label>
          <input type="time" id="fJam"/>
        </div>
      </div>
      <div class="field">
        <label>Alamat</label>
        <textarea id="fAlamat" placeholder="Otomatis dari profil pelanggan jika kosong"></textarea>
      </div>
      <div class="field">
        <label>Catatan</label>
        <textarea id="fCatatan" placeholder='Contoh: "2 kantong besar, tunggu di teras"'></textarea>
      </div>
    </div>
    <div class="lm-f">
      <button class="cancel" onclick="closeForm()">Batal</button>
      <button class="save" id="btnSave" onclick="simpan()">Simpan Jadwal</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const state = {
  filter: 'hari-ini',
  items: [],
  editId: null,
  pelanggan: null,
  searchTimer: null
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showToast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  el.classList.toggle('err', !!err);
  setTimeout(() => el.classList.remove('show'), 2200);
}

const todayISO = () => new Date().toISOString().slice(0,10);
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); }

const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTanggalPendek(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`;
}
function fmtTanggalPanjang(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtJam(jam) {
  if (!jam) return '';
  return jam.slice(0, 5).replace(':', '.');
}

/* ── Filter ──────────────────────────────────── */
function setFilter(f) {
  state.filter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.f === f));
  load();
}

/* ── Load list ───────────────────────────────── */
async function load() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '<div class="empty"><div class="ttl">Memuat…</div></div>';

  let url = '/api/v1/reservasi-jemput';
  const params = new URLSearchParams();
  const today = todayISO();

  if (state.filter === 'hari-ini') {
    params.set('tanggal', today);
    params.set('status', 'terjadwal');
  } else if (state.filter === 'besok') {
    params.set('tanggal', addDays(today, 1));
    params.set('status', 'terjadwal');
  } else if (state.filter === 'minggu-ini') {
    params.set('tanggal', today);
    params.set('sampai_tanggal', addDays(today, 6));
    params.set('status', 'terjadwal');
  } else if (state.filter === 'selesai') {
    params.set('status', 'selesai');
  }
  if (params.toString()) url += '?' + params.toString();

  try {
    const r = await fetch(url, { credentials:'include' });
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error('Gagal memuat');
    const d = await r.json();
    state.items = d.data || [];
    render();
  } catch (e) {
    listEl.innerHTML = `<div class="empty"><div class="ttl">Gagal memuat</div><div>${esc(e.message)}</div></div>`;
  }
}

function render() {
  const listEl = document.getElementById('list');
  const items = state.items;
  document.getElementById('subInfo').textContent = items.length
    ? `${items.length} jadwal`
    : '';

  if (items.length === 0) {
    listEl.innerHTML = `
      <div class="empty">
        <div class="ttl">Tidak ada jadwal penjemputan</div>
        <button class="btn-first" onclick="openForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Tambah Jadwal
        </button>
      </div>`;
    return;
  }

  listEl.innerHTML = items.map(r => {
    const status = r.status;
    const alamat = r.alamat || r.pelanggan_alamat || '';
    const isOpen = status === 'terjadwal';
    const jam = fmtJam(r.jam_jemput);
    const tglJam = jam
      ? `${fmtTanggalPendek(r.tanggal_jemput)} · ${jam}`
      : fmtTanggalPendek(r.tanggal_jemput);
    const statusLabel = status === 'terjadwal' ? 'Terjadwal'
                      : status === 'selesai' ? 'Selesai'
                      : status === 'batal' ? 'Dibatalkan' : status;
    return `
      <div class="card ${status}">
        <div class="c-row1">
          <div class="c-nama">${esc(r.pelanggan_nama || '-')}</div>
          <div class="c-tglJam">${esc(tglJam)}</div>
        </div>
        ${r.pelanggan_telepon ? `<div class="c-tel">${esc(r.pelanggan_telepon)}</div>` : ''}
        ${alamat ? `<div class="c-alamat">${esc(alamat)}</div>` : ''}
        ${r.catatan ? `<div class="c-catatan">${esc(r.catatan)}</div>` : ''}
        ${!isOpen ? `<span class="c-status ${status}">${statusLabel}</span>` : ''}
        ${r.nomor_transaksi ? `<a class="c-order-link" href="/order/detail?id=${r.transaksi_id}">Order ${esc(r.nomor_transaksi)}</a>` : ''}
        ${r.alasan_batal ? `<div class="c-alasan">Alasan: ${esc(r.alasan_batal)}</div>` : ''}
        ${isOpen ? `
        <div class="c-act">
          <button class="btn-ok" onclick="markSelesai(${r.id}, ${r.pelanggan_id || 'null'})">Selesai</button>
          <button class="btn-edit" onclick="openForm(${r.id})">Edit</button>
          <button class="btn-del" onclick="batalkan(${r.id})">Hapus</button>
        </div>` : ''}
      </div>`;
  }).join('');
}

/* ── Form open/close ─────────────────────────── */
async function openForm(id) {
  state.editId = id || null;
  state.pelanggan = null;
  document.getElementById('formTitle').textContent = id ? 'Edit Jadwal Jemput' : 'Tambah Jadwal Jemput';
  document.getElementById('plSearch').value = '';
  document.getElementById('plResult').classList.remove('open');
  document.getElementById('plSelectedWrap').innerHTML = '';
  document.getElementById('fTanggal').value = todayISO();
  document.getElementById('fTanggal').min = todayISO();
  document.getElementById('fJam').value = '';
  document.getElementById('fAlamat').value = '';
  document.getElementById('fCatatan').value = '';

  if (id) {
    try {
      const r = await fetch(`/api/v1/reservasi-jemput/${id}`, { credentials:'include' });
      const { data } = await r.json();
      state.pelanggan = {
        id: data.pelanggan_id,
        nama: data.pelanggan_nama,
        telepon: data.pelanggan_telepon,
        alamat: data.pelanggan_alamat
      };
      renderSelectedPelanggan();
      document.getElementById('fTanggal').value = data.tanggal_jemput;
      document.getElementById('fJam').value = data.jam_jemput || '';
      document.getElementById('fAlamat').value = data.alamat || '';
      document.getElementById('fCatatan').value = data.catatan || '';
    } catch (e) {
      showToast('Gagal memuat data edit', true);
      return;
    }
  }

  document.getElementById('formModal').classList.add('open');
}

function closeForm() {
  document.getElementById('formModal').classList.remove('open');
}

function renderSelectedPelanggan() {
  const wrap = document.getElementById('plSelectedWrap');
  const search = document.getElementById('plSearch');
  if (!state.pelanggan) { wrap.innerHTML = ''; search.style.display = ''; return; }
  search.style.display = 'none';
  wrap.innerHTML = `
    <div class="pl-selected">
      <div>
        <div class="ttl">${esc(state.pelanggan.nama)}</div>
        <div class="meta">${esc(state.pelanggan.telepon || '-')}</div>
      </div>
      <button class="xbtn" onclick="clearPelanggan()" aria-label="Hapus pelanggan">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>`;
  if (state.pelanggan.alamat && !document.getElementById('fAlamat').value) {
    document.getElementById('fAlamat').value = state.pelanggan.alamat;
  }
}

function clearPelanggan() {
  state.pelanggan = null;
  renderSelectedPelanggan();
  document.getElementById('plSearch').focus();
}

/* ── Search pelanggan ────────────────────────── */
function onSearchPelanggan() {
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(searchPelanggan, 300);
}

async function searchPelanggan() {
  const q = document.getElementById('plSearch').value.trim();
  const res = document.getElementById('plResult');
  if (q.length < 1) { res.classList.remove('open'); return; }
  try {
    const r = await fetch(`/api/v1/pelanggan?q=${encodeURIComponent(q)}&limit=8`, { credentials:'include' });
    const d = await r.json();
    const items = d.data || [];
    if (items.length === 0) {
      res.innerHTML = '<div class="pl-item" style="color:#94A3B8">Tidak ditemukan</div>';
    } else {
      res.innerHTML = items.map(p => `
        <div class="pl-item" onclick='pickPelanggan(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
          <div style="font-weight:700">${esc(p.nama)}</div>
          <div style="font-size:11px;color:#94A3B8">${esc(p.telepon || '-')}</div>
        </div>`).join('');
    }
    res.classList.add('open');
  } catch {
    res.innerHTML = '<div class="pl-item" style="color:#EF4444">Error</div>';
    res.classList.add('open');
  }
}

function pickPelanggan(p) {
  state.pelanggan = p;
  document.getElementById('plSearch').value = '';
  document.getElementById('plResult').classList.remove('open');
  renderSelectedPelanggan();
}

/* ── Simpan ──────────────────────────────────── */
async function simpan() {
  if (!state.pelanggan) { showToast('Pilih pelanggan dulu', true); return; }
  const tanggal = document.getElementById('fTanggal').value;
  if (!tanggal) { showToast('Tanggal wajib diisi', true); return; }

  const body = {
    pelanggan_id: state.pelanggan.id,
    tanggal_jemput: tanggal,
    jam_jemput: document.getElementById('fJam').value || null,
    alamat: document.getElementById('fAlamat').value.trim() || null,
    catatan: document.getElementById('fCatatan').value.trim() || null
  };

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Menyimpan…';
  try {
    const url = state.editId
      ? `/api/v1/reservasi-jemput/${state.editId}`
      : '/api/v1/reservasi-jemput';
    const r = await fetch(url, {
      method: state.editId ? 'PUT' : 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Gagal menyimpan', true); return; }
    showToast(state.editId ? 'Reservasi diperbarui' : 'Reservasi dibuat');
    closeForm();
    load();
    if (window.posRefreshBadges) window.posRefreshBadges();
  } catch (e) {
    showToast('Gagal: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Simpan Jadwal';
  }
}

/* ── Aksi card ───────────────────────────────── */
async function markSelesai(id, pelangganId) {
  try {
    const r = await fetch(`/api/v1/reservasi-jemput/${id}/selesai`, {
      method: 'PUT', credentials:'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Gagal', true); return; }
    showToast('Reservasi selesai');
    load();
    if (window.posRefreshBadges) window.posRefreshBadges();
    if (pelangganId && confirm('Langsung buat order untuk pelanggan ini sekarang?')) {
      location.href = `/order/baru?pelanggan_id=${pelangganId}&reservasi_id=${id}`;
    }
  } catch (e) { showToast('Gagal: ' + e.message, true); }
}

async function batalkan(id) {
  const alasan = prompt('Alasan pembatalan (opsional):');
  if (alasan === null) return;
  try {
    const r = await fetch(`/api/v1/reservasi-jemput/${id}/batal`, {
      method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ alasan })
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Gagal', true); return; }
    showToast('Reservasi dibatalkan');
    load();
    if (window.posRefreshBadges) window.posRefreshBadges();
  } catch (e) { showToast('Gagal: ' + e.message, true); }
}

/* ── Init: cek query param ?edit= ─────────────── */
(function init() {
  const p = new URLSearchParams(location.search);
  const editId = p.get('edit');
  if (editId) { openForm(Number(editId)); }
  load();
})();
</script>

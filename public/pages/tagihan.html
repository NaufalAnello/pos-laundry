<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>Tagihan — POS Laundry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }

    /* Nav.js sudah render topbar mobile — sembunyikan supaya tidak dobel */
    .pos-topbar { display: none !important; }

    /* ── Sticky Header ─────────────────────────────────── */
    .tg-head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .tg-head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .tg-head .ic-btn:hover { box-shadow: 0 2px 8px rgba(45,59,181,0.12); }
    .tg-title { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }

    /* ── Search bar (toggle) ───────────────────────────── */
    .search-bar { padding: 0 16px 8px; display: none; }
    .search-bar.open { display: block; }
    .search-bar input {
      width: 100%; padding: 10px 14px; border: 1px solid #E2E8F0;
      border-radius: 10px; font-size: 14px; font-family: inherit;
      background: #fff; color: #1E2A6E; outline: none;
    }
    .search-bar input:focus { border-color: #2D3BB5; }

    /* ── Body ──────────────────────────────────────────── */
    .body-wrap {
      padding: 4px 16px 130px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* ── Summary card (spek: gradient merah) ───────────── */
    .sum-card {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 4px 16px rgba(220,38,38,0.20);
      display: block; text-decoration: none;
    }
    .sum-lbl {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; opacity: 0.85; color: #fff;
    }
    .sum-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 10px; margin-top: 4px;
    }
    .sum-amt { font-size: 26px; font-weight: 800; line-height: 1.1; color: #fff; }
    .sum-chip {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.2); color: #fff;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .sum-card.empty {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      box-shadow: 0 4px 16px rgba(16,185,129,0.20);
    }

    /* ── Filter pills (spek: sama seperti Antrian) ─────── */
    .pills { display: flex; gap: 6px; }
    .pill {
      flex: 1; height: 36px; padding: 0 8px; border-radius: 999px;
      border: 1px solid #E2E8F0; background: #fff;
      font-size: 12px; font-weight: 600; cursor: pointer;
      color: #64748B; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .pill:active { transform: scale(.97); }
    .pill.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }

    .info-line { font-size: 12px; color: #64748B; padding: 0 2px; }

    /* ── Tagihan card (spek README + reference) ────────── */
    .tg-list { display: flex; flex-direction: column; gap: 10px; }
    .tg-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .tg-row1 {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .tg-nomor {
      font-size: 12px; font-weight: 700; color: #94A3B8;
      letter-spacing: 0.4px; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tg-nomor .age { color: #64748B; font-weight: 600; }
    .tg-badges { display: inline-flex; gap: 5px; flex-shrink: 0; }

    .tg-row2 {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; cursor: pointer;
    }
    .tg-mid { min-width: 0; flex: 1; }
    .tg-nama {
      font-size: 15px; font-weight: 600; color: #1E2A6E; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tg-svc {
      font-size: 13px; color: #64748B; margin-top: 2px; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tg-sisa {
      font-size: 15px; font-weight: 700; color: #EF4444; white-space: nowrap;
      flex-shrink: 0;
    }

    .tg-actions { display: flex; gap: 6px; }
    .tg-act {
      flex: 1; height: 38px; padding: 0 12px;
      border: 1px solid transparent; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      font-family: inherit; text-decoration: none;
      transition: opacity .15s;
    }
    .tg-act:active { opacity: .8; transform: scale(.98); }
    .tg-act.lunasi { background: #10B981; color: #fff; }
    .tg-act.wa     { background: #fff; border-color: #E2E8F0; color: #2D3BB5; }

    /* ── Badge status bayar (spek) ─────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
      line-height: 1;
    }
    .b-belum { background: #FDECEC; color: #EF4444; }
    .b-dp    { background: #FEF3E2; color: #F59E0B; }
    .b-lunas { background: #E7F8F1; color: #10B981; }

    /* ── Empty state (spek: teks tengah 13px #94A3B8) ── */
    .empty {
      text-align: center; padding: 40px 20px;
      color: #94A3B8; font-size: 13px;
    }

    /* ── Toast (spek Komponen Konsisten) ──────────────── */
    #toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1E2A6E; color: #fff; padding: 10px 20px; border-radius: 99px;
      font-size: 13px; font-weight: 600; z-index: 9999;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #toast.show { opacity: 1; }

    /* ── DESKTOP (>= 1024px): table view ──────────────── */
    .desktop-only { display: none; }
    .mobile-only { display: block; }

    @media (min-width: 1024px) {
      .desktop-only { display: block; }
      .mobile-only  { display: none; }

      .body-wrap { padding: 4px 20px 40px; }
      .tg-head   { padding: 18px 20px 10px; }
      .search-bar { padding: 0 20px 10px; }

      .tg-table-card {
        background: #fff; border-radius: 10px;
        box-shadow: 0 1px 3px rgba(45,59,181,0.08);
        overflow: hidden;
      }
      .tg-table-wrap { overflow-x: auto; }
      table.tg-table { width: 100%; border-collapse: collapse; }
      table.tg-table thead th {
        padding: 12px 14px; text-align: left;
        font-size: 11px; font-weight: 700; color: #64748B;
        text-transform: uppercase; letter-spacing: .5px;
        background: #F8FAFF; border-bottom: 1px solid #E2E8F0;
        white-space: nowrap;
      }
      table.tg-table tbody tr {
        border-bottom: 1px solid #F1F5F9; transition: background .1s; cursor: pointer;
      }
      table.tg-table tbody tr:hover { background: #F8FAFF; }
      table.tg-table tbody tr:last-child { border-bottom: none; }
      table.tg-table tbody td {
        padding: 12px 14px; font-size: 13px; vertical-align: middle; color: #1E2A6E;
      }
      table.tg-table .td-actions {
        display: flex; gap: 6px; justify-content: flex-end;
      }
      table.tg-table .td-actions .tg-act {
        height: 32px; padding: 0 12px; font-size: 12px; flex: 0 0 auto;
      }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="tg-head">
    <a class="ic-btn" href="/dashboard" title="Kembali" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="tg-title">Tagihan</div>
    <button class="ic-btn" onclick="toggleSearch()" title="Cari" aria-label="Cari">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16.7 16.7"/></svg>
    </button>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Cari nama pelanggan / nomor order..." autocomplete="off"/>
  </div>

  <div class="body-wrap">
    <div class="sum-card" id="sumCard">
      <div class="sum-lbl">Total belum lunas</div>
      <div class="sum-row">
        <div class="sum-amt" id="sumAmt">Rp 0</div>
        <div class="sum-chip" id="sumChip">0 order</div>
      </div>
    </div>

    <div class="pills" id="pills">
      <button class="pill active" data-filter="semua">Semua</button>
      <button class="pill" data-filter="belum">Belum Bayar</button>
      <button class="pill" data-filter="dp">DP</button>
    </div>

    <div class="info-line" id="infoBar">Memuat...</div>

    <div class="mobile-only">
      <div class="tg-list" id="cardList"></div>
    </div>

    <div class="desktop-only">
      <div class="tg-table-card">
        <div class="tg-table-wrap">
          <table class="tg-table">
            <thead>
              <tr>
                <th>Pelanggan</th>
                <th>No. Order</th>
                <th>Umur</th>
                <th>Status</th>
                <th>Total</th>
                <th>Sisa</th>
                <th style="text-align:right">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:#94A3B8">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const fmtRp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const fmtDate = s => s ? new Date(s).toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }) : '—';
const daysSince = s => {
  if (!s) return 0;
  const d1 = new Date(s); d1.setHours(0,0,0,0);
  const d2 = new Date(); d2.setHours(0,0,0,0);
  return Math.max(0, Math.floor((d2 - d1) / 86400000));
};
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let allData = [];
let activeFilter = 'semua';
let searchQuery = '';
let debTimer = null;

function showToast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
window.showToast = showToast;

function toggleSearch() {
  const bar = document.getElementById('searchBar');
  bar.classList.toggle('open');
  if (bar.classList.contains('open')) {
    document.getElementById('searchInput').focus();
  } else {
    document.getElementById('searchInput').value = '';
    searchQuery = '';
    rerender();
  }
}

/* ── Helpers ─────────────────────────────────────────── */
function tipeTagihan(t) {
  return Number(t.bayar || 0) > 0 ? 'dp' : 'belum';
}
function sisa(t) { return Math.max(0, Number(t.total_bayar) - Number(t.bayar)); }

function lunasiPayload(t) {
  return {
    id: t.id, nomor: t.nomor_transaksi, nama: t.pelanggan_nama,
    total: t.total_bayar, dibayar: t.bayar, pelanggan_id: t.pelanggan_id
  };
}
function waPayload(t) {
  return { id: t.id, nomor: t.nomor_transaksi, nama: t.pelanggan_nama, telepon: t.pelanggan_telepon };
}

/* ── Filter (client-side) ───────────────────────────── */
function applyFilter(data, key) {
  if (key === 'semua') return data;
  if (key === 'belum') return data.filter(t => tipeTagihan(t) === 'belum');
  if (key === 'dp')    return data.filter(t => tipeTagihan(t) === 'dp');
  return data;
}

/* ── Sort: paling lama menunggak duluan (fixed) ─────── */
function sortTerlama(data) {
  return [...data].sort((a, b) => new Date(a.tanggal_masuk) - new Date(b.tanggal_masuk));
}

function umurLabel(t) {
  const hari = daysSince(t.tanggal_masuk);
  if (tipeTagihan(t) === 'dp') return `DP ${fmtRp(t.bayar)}`;
  if (hari <= 0) return 'menunggak hari ini';
  return `menunggak ${hari} hari`;
}

/* ── Update summary ─────────────────────────────────── */
function updateSummary() {
  const totalSisa = allData.reduce((s, t) => s + sisa(t), 0);
  const sumCard = document.getElementById('sumCard');
  const sumAmt  = document.getElementById('sumAmt');
  const sumChip = document.getElementById('sumChip');

  if (!allData.length) {
    sumCard.classList.add('empty');
    sumAmt.textContent = 'Lunas';
    sumChip.textContent = 'Semua sudah dibayar';
    return;
  }
  sumCard.classList.remove('empty');
  sumAmt.textContent = fmtRp(totalSisa);
  sumChip.textContent = `${allData.length} order`;
}

/* ── Render ─────────────────────────────────────────── */
function renderCardList(rows) {
  const el = document.getElementById('cardList');
  if (!rows.length) {
    el.innerHTML = `<div class="empty">${allData.length === 0 ? 'Semua lunas. Mantap!' : 'Tidak ada tagihan di filter ini'}</div>`;
    return;
  }

  el.innerHTML = rows.map(t => {
    const tipe = tipeTagihan(t);
    const s = sisa(t);
    const tel = t.pelanggan_telepon;
    const pl = JSON.stringify(lunasiPayload(t)).replace(/'/g, "&#39;");
    const wp = JSON.stringify(waPayload(t)).replace(/'/g, "&#39;");
    const layanan = t.layanan_ringkas || '—';
    const badge = tipe === 'dp'
      ? '<span class="badge b-dp">DP</span>'
      : '<span class="badge b-belum">Belum Lunas</span>';

    return `
      <div class="tg-card">
        <div class="tg-row1">
          <div class="tg-nomor">${escHtml(t.nomor_transaksi)} <span class="age">· ${escHtml(umurLabel(t))}</span></div>
          <div class="tg-badges">${badge}</div>
        </div>
        <div class="tg-row2" onclick="location.href='/order/detail?id=${t.id}'">
          <div class="tg-mid">
            <div class="tg-nama">${escHtml(t.pelanggan_nama || 'Non-member')}</div>
            <div class="tg-svc" title="${escHtml(layanan)}">${escHtml(layanan)}</div>
          </div>
          <div class="tg-sisa">${fmtRp(s)}</div>
        </div>
        <div class="tg-actions" onclick="event.stopPropagation()">
          <button class="tg-act lunasi" onclick='openLunasiSheet(${pl})'>Lunasi</button>
          ${tel ? `<button class="tg-act wa" onclick='openWaSheet(${wp})'>Tagih via WA</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#94A3B8">${allData.length === 0 ? 'Semua lunas. Mantap!' : 'Tidak ada tagihan di filter ini'}</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(t => {
    const tipe = tipeTagihan(t);
    const s = sisa(t);
    const tel = t.pelanggan_telepon;
    const pl = JSON.stringify(lunasiPayload(t)).replace(/'/g, "&#39;");
    const wp = JSON.stringify(waPayload(t)).replace(/'/g, "&#39;");
    const badge = tipe === 'dp'
      ? '<span class="badge b-dp">DP</span>'
      : '<span class="badge b-belum">Belum Lunas</span>';

    return `
      <tr onclick="location.href='/order/detail?id=${t.id}'">
        <td>
          <div style="font-weight:700;color:#1E2A6E">${escHtml(t.pelanggan_nama || 'Non-member')}</div>
          ${tel ? `<div style="font-size:11px;color:#64748B">${escHtml(tel)}</div>` : ''}
        </td>
        <td style="font-family:ui-monospace,monospace;font-size:12px;color:#64748B">${escHtml(t.nomor_transaksi)}</td>
        <td style="white-space:nowrap;font-size:12px;color:#64748B">${escHtml(umurLabel(t))}</td>
        <td>${badge}</td>
        <td style="white-space:nowrap;font-weight:700">${fmtRp(t.total_bayar)}</td>
        <td style="white-space:nowrap;font-weight:700;color:#EF4444">${fmtRp(s)}</td>
        <td>
          <div class="td-actions" onclick="event.stopPropagation()">
            <button class="tg-act lunasi" onclick='openLunasiSheet(${pl})'>Lunasi</button>
            ${tel ? `<button class="tg-act wa" onclick='openWaSheet(${wp})'>Tagih via WA</button>` : ''}
          </div>
        </td>
      </tr>`;
  }).join('');
}

/* ── Render orchestrator ────────────────────────────── */
function rerender() {
  let rows = applyFilter(allData, activeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    rows = rows.filter(t => (
      (t.pelanggan_nama || '').toLowerCase().includes(q) ||
      (t.nomor_transaksi || '').toLowerCase().includes(q) ||
      (t.pelanggan_telepon || '').includes(q)
    ));
  }
  rows = sortTerlama(rows);

  document.getElementById('infoBar').textContent =
    `Menampilkan ${rows.length} dari ${allData.length} tagihan${searchQuery ? ' untuk "' + searchQuery + '"' : ''}`;

  renderCardList(rows);
  renderTable(rows);
}

/* ── Loader ─────────────────────────────────────────── */
async function loadData() {
  try {
    const r = await fetch('/api/v1/transaksi?belum_lunas=1&sort=tanggal_asc&limit=500', { credentials: 'include' });
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    allData = d.data || [];
    updateSummary();
    rerender();
  } catch {
    document.getElementById('infoBar').textContent = 'Gagal memuat data';
    document.getElementById('cardList').innerHTML = '<div class="empty">Gagal memuat data</div>';
  }
}

/* ── Bind filter pills ──────────────────────────────── */
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    activeFilter = p.dataset.filter;
    rerender();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(debTimer);
  debTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    rerender();
  }, 200);
});

/* ── Reload setelah pelunasan ───────────────────────── */
window.addEventListener('lunasi:done', () => {
  showToast('Pembayaran tersimpan');
  loadData();
});

loadData();
</script>
<script src="/js/lunasi-sheet.js"></script>
<script src="/js/wa-sheet.js"></script>
<script src="/js/nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>Promo — POS Laundry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }
    .pos-topbar { display: none !important; }

    /* ── Header ─────────────────────────────────── */
    .pr-head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .pr-head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .pr-title { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }
    .btn-add {
      height: 36px; padding: 0 14px; border: none; border-radius: 8px;
      background: #2D3BB5; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-add:active { transform: scale(.97); }

    /* ── Filter pills ─────────────────────────── */
    .pill-row {
      display: flex; gap: 6px; padding: 0 16px 6px;
      overflow-x: auto; scrollbar-width: none;
    }
    .pill-row::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; padding: 0 14px; height: 36px;
      border: 1px solid #E2E8F0; background: #fff; color: #64748B;
      border-radius: 999px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }
    .pill .cnt {
      background: #F1F5F9; color: #64748B; padding: 1px 7px;
      border-radius: 99px; font-size: 11px; font-weight: 800;
    }
    .pill.active .cnt { background: rgba(255,255,255,.25); color: #fff; }

    /* ── Body ─────────────────────────────────── */
    .body-wrap {
      padding: 4px 16px 130px;
      display: flex; flex-direction: column; gap: 10px;
    }

    /* ── Promo card ────────────────────────────── */
    .promo-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .promo-card.inactive { opacity: .7; }
    .promo-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .promo-nama {
      font-size: 14px; font-weight: 700; color: #1E2A6E; line-height: 1.3;
    }
    .promo-badge {
      flex-shrink: 0;
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 6px;
      white-space: nowrap;
    }
    .badge-aktif { background: #E7F8F1; color: #10B981; }
    .badge-nonaktif { background: #F1F5F9; color: #94A3B8; }
    .badge-expired { background: #FDECEC; color: #EF4444; }
    .badge-terjadwal { background: #FEF3E2; color: #F59E0B; }

    .promo-diskon { font-size: 15px; font-weight: 800; color: #2D3BB5; }
    .promo-desc { font-size: 13px; color: #64748B; line-height: 1.4; }
    .promo-meta {
      font-size: 12px; color: #94A3B8; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .promo-hari { display: flex; gap: 4px; flex-wrap: wrap; }
    .hari-chip {
      padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 700;
      background: #E3F2FF; color: #2563EB; text-transform: uppercase; letter-spacing: .3px;
    }

    .promo-actions {
      display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid #F1F5F9;
    }
    .promo-actions button {
      flex: 1; height: 36px; padding: 0 10px;
      border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-tgl-off {
      background: #10B981; color: #fff; border: none;
    }
    .btn-tgl-on {
      background: #fff; color: #64748B; border: 1px solid #E2E8F0;
    }
    .btn-edit {
      background: #fff; color: #64748B; border: 1px solid #E2E8F0;
    }
    .btn-del {
      background: #fff; color: #EF4444; border: 1px solid #FDECEC;
      flex: 0 0 44px;
    }

    .empty {
      text-align: center; padding: 40px 20px; color: #94A3B8;
      background: #fff; border-radius: 10px; border: 1px dashed #E2E8F0;
    }
    .empty .ttl-em { font-size: 15px; font-weight: 700; color: #64748B; margin-bottom: 4px; }

    /* ── Toast ────────────────────────────────── */
    #toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1E2A6E; color: #fff; padding: 10px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 99999;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: #EF4444; }

    /* ── Modal ────────────────────────────────── */
    .modal-bg {
      display: none; position: fixed !important; inset: 0 !important;
      background: rgba(30,42,110,0.45) !important; z-index: 9999 !important;
      align-items: flex-end; justify-content: center;
      padding: 0; overflow-y: auto;
    }
    .modal-bg.open { display: flex !important; }
    .modal {
      background: #fff; border-radius: 18px 18px 0 0;
      width: 100%; max-width: 100%; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 -8px 32px rgba(45,59,181,.18);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid #E2E8F0;
      position: sticky; top: 0; background: #fff; z-index: 2;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: #1E2A6E; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px;
      background: #F1F5F9; border: none; cursor: pointer; color: #64748B;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer {
      padding: 12px 18px; border-top: 1px solid #E2E8F0;
      display: flex; gap: 8px; position: sticky; bottom: 0; background: #fff;
    }
    .modal-footer .btn { flex: 1; min-height: 44px; }

    /* Form */
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label {
      font-size: 12px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: .3px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid #E2E8F0;
      border-radius: 8px; font-size: 14px; color: #1E2A6E; outline: none;
      font-family: inherit; background: #fff; min-height: 44px;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #2D3BB5; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-hint { font-size: 11px; color: #94A3B8; }

    /* Jenis radio */
    .jenis-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .jenis-radio { position: relative; }
    .jenis-radio input { position: absolute; opacity: 0; pointer-events: none; }
    .jenis-radio label {
      display: block; padding: 10px 8px; border: 1.5px solid #E2E8F0;
      border-radius: 8px; text-align: center; cursor: pointer;
      font-size: 13px; font-weight: 600; color: #94A3B8;
      min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .jenis-radio input:checked + label {
      border-color: #2D3BB5; color: #2D3BB5; background: #E3F2FF;
    }

    /* Hari checkbox */
    .hari-group { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
    .hari-cb { position: relative; }
    .hari-cb input { position: absolute; opacity: 0; pointer-events: none; }
    .hari-cb label {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 0; border: 1.5px solid #E2E8F0; border-radius: 6px;
      text-align: center; cursor: pointer;
      font-size: 11px; font-weight: 700; color: #94A3B8;
      min-height: 40px;
    }
    .hari-cb input:checked + label {
      border-color: #2D3BB5; color: #fff; background: #2D3BB5;
    }

    /* Aktif toggle */
    .toggle-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: #F8FAFF; border-radius: 8px;
    }
    .toggle {
      position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #E2E8F0; border-radius: 99px;
      cursor: pointer; transition: .2s;
    }
    .slider::before {
      content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #10B981; }
    input:checked + .slider::before { transform: translateX(18px); }

    .btn {
      padding: 10px 16px; border-radius: 8px; border: 1px solid transparent;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: #2D3BB5; color: #fff; }
    .btn-outline { background: #fff; border-color: #E2E8F0; color: #64748B; }

    @media (min-width: 1024px) {
      .pr-head { padding: 16px 20px 10px; }
      .pr-title { font-size: 22px; }
      .pill-row { padding: 0 20px 6px; }
      .body-wrap { padding: 4px 20px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
      .modal-bg { align-items: center; padding: 16px; }
      .modal { max-width: 540px; border-radius: 14px; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="pr-head">
    <a class="ic-btn" href="/dashboard" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="pr-title">Promo</div>
    <button class="btn-add" onclick="openModal()" aria-label="Tambah promo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Promo</span>
    </button>
  </div>

  <div class="pill-row" id="tabBar">
    <button class="pill active" data-tab="semua" onclick="setTab('semua',this)">Semua <span class="cnt" id="cnt-semua">0</span></button>
    <button class="pill" data-tab="aktif" onclick="setTab('aktif',this)">Aktif <span class="cnt" id="cnt-aktif">0</span></button>
    <button class="pill" data-tab="nonaktif" onclick="setTab('nonaktif',this)">Nonaktif <span class="cnt" id="cnt-nonaktif">0</span></button>
    <button class="pill" data-tab="terjadwal" onclick="setTab('terjadwal',this)">Terjadwal <span class="cnt" id="cnt-terjadwal">0</span></button>
    <button class="pill" data-tab="expired" onclick="setTab('expired',this)">Expired <span class="cnt" id="cnt-expired">0</span></button>
  </div>

  <div id="promoList" class="body-wrap">
    <div class="empty"><div class="ttl-em">Memuat…</div></div>
  </div>
</div>

<!-- Modal Form -->
<div class="modal-bg" id="promoModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Tambah Promo</div>
      <button class="modal-close" onclick="closeModal()" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="promoId"/>

      <div class="form-group">
        <label class="form-label">Nama Promo *</label>
        <input type="text" id="fNama" class="form-input" placeholder="contoh: Promo Akhir Pekan"/>
      </div>

      <div class="form-group">
        <label class="form-label">Deskripsi</label>
        <input type="text" id="fDeskripsi" class="form-input" placeholder="Opsional"/>
      </div>

      <div class="form-group">
        <label class="form-label">Jenis Promo *</label>
        <div class="jenis-group">
          <div class="jenis-radio">
            <input type="radio" name="jenis" id="jPersen" value="persen" checked onchange="onJenisChange()"/>
            <label for="jPersen">% Persen</label>
          </div>
          <div class="jenis-radio">
            <input type="radio" name="jenis" id="jNominal" value="nominal" onchange="onJenisChange()"/>
            <label for="jNominal">Rp Nominal</label>
          </div>
          <div class="jenis-radio">
            <input type="radio" name="jenis" id="jPaket" value="paket" onchange="onJenisChange()"/>
            <label for="jPaket">Paket</label>
          </div>
        </div>
      </div>

      <div id="diskonWrap" class="form-row">
        <div class="form-group" id="diskonPersenGroup">
          <label class="form-label">Diskon Persen (%)</label>
          <input type="number" id="fDiskonPersen" class="form-input" min="0" max="100" value="0" placeholder="10"/>
        </div>
        <div class="form-group" id="diskonNominalGroup" style="display:none">
          <label class="form-label">Diskon Nominal (Rp)</label>
          <input type="number" id="fDiskonNominal" class="form-input" min="0" value="0" placeholder="5000"/>
        </div>
        <div class="form-group">
          <label class="form-label">Min. Pembelian (Rp)</label>
          <input type="number" id="fMinBeli" class="form-input" min="0" value="0" placeholder="0 = semua"/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Berlaku Mulai</label>
          <input type="date" id="fMulai" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label">Berlaku Sampai</label>
          <input type="date" id="fSampai" class="form-input"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Hari Berlaku <span style="font-weight:400;text-transform:none;color:#94A3B8">(kosongi = semua hari)</span></label>
        <div class="hari-group">
          <div class="hari-cb"><input type="checkbox" id="h0" value="0"/><label for="h0">Min</label></div>
          <div class="hari-cb"><input type="checkbox" id="h1" value="1"/><label for="h1">Sen</label></div>
          <div class="hari-cb"><input type="checkbox" id="h2" value="2"/><label for="h2">Sel</label></div>
          <div class="hari-cb"><input type="checkbox" id="h3" value="3"/><label for="h3">Rab</label></div>
          <div class="hari-cb"><input type="checkbox" id="h4" value="4"/><label for="h4">Kam</label></div>
          <div class="hari-cb"><input type="checkbox" id="h5" value="5"/><label for="h5">Jum</label></div>
          <div class="hari-cb"><input type="checkbox" id="h6" value="6"/><label for="h6">Sab</label></div>
        </div>
      </div>

      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="fAktif" checked/>
          <span class="slider"></span>
        </label>
        <span style="font-size:13px;font-weight:700;color:#1E2A6E">Promo aktif</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="saveBtn" onclick="savePromo()">Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const HARI_LABEL = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_SHORT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const fmtRp = n => Number(n||0).toLocaleString('id-ID');
const fmtDate = s => s ? new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let currentTab = 'semua';
let allPromo = [];

function showToast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  el.classList.toggle('err', !!err);
  setTimeout(() => el.classList.remove('show'), 2200);
}

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList(filterData(allPromo, tab));
}

function filterData(data, tab) {
  const today = new Date().toISOString().slice(0,10);
  if (tab === 'aktif') return data.filter(p => p.aktif && (!p.berlaku_sampai || p.berlaku_sampai >= today));
  if (tab === 'nonaktif') return data.filter(p => !p.aktif);
  if (tab === 'terjadwal') return data.filter(p => p.berlaku_mulai && p.berlaku_mulai > today);
  if (tab === 'expired') return data.filter(p => p.berlaku_sampai && p.berlaku_sampai < today);
  return data;
}

function updateCounts(data) {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('cnt-semua').textContent = data.length;
  document.getElementById('cnt-aktif').textContent = data.filter(p => p.aktif && (!p.berlaku_sampai || p.berlaku_sampai >= today)).length;
  document.getElementById('cnt-nonaktif').textContent = data.filter(p => !p.aktif).length;
  document.getElementById('cnt-terjadwal').textContent = data.filter(p => p.berlaku_mulai && p.berlaku_mulai > today).length;
  document.getElementById('cnt-expired').textContent = data.filter(p => p.berlaku_sampai && p.berlaku_sampai < today).length;
}

function renderList(data) {
  const el = document.getElementById('promoList');
  if (!data.length) {
    el.innerHTML = `<div class="empty"><div class="ttl-em">Belum ada promo</div><div>Tap tombol Promo untuk menambah promo baru</div></div>`;
    return;
  }

  const today = new Date().toISOString().slice(0,10);
  el.innerHTML = data.map(p => {
    const isExpired = p.berlaku_sampai && p.berlaku_sampai < today;
    const isTerjadwal = p.berlaku_mulai && p.berlaku_mulai > today;

    let diskonStr = '';
    if (p.jenis === 'persen' || (p.diskon_persen > 0 && p.jenis !== 'nominal' && p.jenis !== 'paket'))
      diskonStr = `${p.diskon_persen}% OFF`;
    else if (p.jenis === 'nominal' || (!p.diskon_persen && p.diskon_nominal > 0))
      diskonStr = `Rp ${fmtRp(p.diskon_nominal)} OFF`;
    else if (p.jenis === 'paket')
      diskonStr = 'Harga Paket Spesial';

    const badgeCls = isExpired ? 'badge-expired'
                   : isTerjadwal ? 'badge-terjadwal'
                   : p.aktif ? 'badge-aktif' : 'badge-nonaktif';
    const badgeLabel = isExpired ? 'Expired'
                     : isTerjadwal ? 'Terjadwal'
                     : p.aktif ? 'Aktif' : 'Nonaktif';

    const metaBits = [];
    if (p.min_pembelian > 0) metaBits.push(`Min. Rp ${fmtRp(p.min_pembelian)}`);
    if (p.berlaku_mulai || p.berlaku_sampai) {
      metaBits.push(`${fmtDate(p.berlaku_mulai) || 'sekarang'} – ${fmtDate(p.berlaku_sampai) || 'tanpa batas'}`);
    }

    let hariStr = '';
    if (p.hari_berlaku) {
      try {
        const hari = JSON.parse(p.hari_berlaku);
        if (hari.length) {
          hariStr = `<div class="promo-hari">${hari.map(h => `<span class="hari-chip">${HARI_SHORT[h]}</span>`).join('')}</div>`;
        }
      } catch {}
    }

    const tglCls = p.aktif ? 'btn-tgl-on' : 'btn-tgl-off';
    const tglLabel = p.aktif ? 'Nonaktifkan' : 'Aktifkan';

    const namaEsc = esc(p.nama).replace(/'/g, "&#39;");

    return `<div class="promo-card ${p.aktif ? '' : 'inactive'}">
      <div class="promo-top">
        <div class="promo-nama">${esc(p.nama)}</div>
        <span class="promo-badge ${badgeCls}">${badgeLabel}</span>
      </div>
      ${diskonStr ? `<div class="promo-diskon">${diskonStr}</div>` : ''}
      ${p.deskripsi ? `<div class="promo-desc">${esc(p.deskripsi)}</div>` : ''}
      ${metaBits.length ? `<div class="promo-meta">${metaBits.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
      ${hariStr}
      <div class="promo-actions">
        <button class="${tglCls}" onclick="togglePromo(${p.id})">${tglLabel}</button>
        <button class="btn-edit" onclick='editPromo(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button>
        <button class="btn-del" onclick="deletePromo(${p.id},'${namaEsc.replace(/'/g,"\\'")}')" aria-label="Hapus">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

async function loadPromo() {
  try {
    const r = await fetch('/api/v1/promo', { credentials:'include' });
    if (r.status === 401) { location.href='/login'; return; }
    const d = await r.json();
    allPromo = d.data || [];
    updateCounts(allPromo);
    renderList(filterData(allPromo, currentTab));
  } catch(e) {
    document.getElementById('promoList').innerHTML =
      '<div class="empty"><div class="ttl-em" style="color:#EF4444">Gagal memuat data</div></div>';
  }
}

// ── Toggle ────────────────────────────────────────────────────────────────────
async function togglePromo(id) {
  try {
    const r = await fetch(`/api/v1/promo/${id}/toggle`, { method:'PATCH', credentials:'include' });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message);
    loadPromo();
  } catch { showToast('Koneksi gagal', true); }
}

async function deletePromo(id, nama) {
  if (!confirm(`Hapus promo "${nama}"?`)) return;
  try {
    const r = await fetch(`/api/v1/promo/${id}`, { method:'DELETE', credentials:'include' });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message + (d.soft ? ' (dinonaktifkan)' : ''));
    loadPromo();
  } catch { showToast('Koneksi gagal', true); }
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function onJenisChange() {
  const jenis = document.querySelector('input[name="jenis"]:checked')?.value;
  document.getElementById('diskonPersenGroup').style.display = jenis === 'persen' ? '' : 'none';
  document.getElementById('diskonNominalGroup').style.display = jenis === 'nominal' || jenis === 'paket' ? '' : 'none';
}

function openModal(data = null) {
  document.getElementById('promoId').value = data?.id || '';
  document.getElementById('fNama').value = data?.nama || '';
  document.getElementById('fDeskripsi').value = data?.deskripsi || '';
  document.getElementById('fDiskonPersen').value = data?.diskon_persen || 0;
  document.getElementById('fDiskonNominal').value = data?.diskon_nominal || 0;
  document.getElementById('fMinBeli').value = data?.min_pembelian || 0;
  document.getElementById('fMulai').value = data?.berlaku_mulai || '';
  document.getElementById('fSampai').value = data?.berlaku_sampai || '';
  document.getElementById('fAktif').checked = data ? !!data.aktif : true;

  const jenis = data?.jenis || 'persen';
  document.querySelector(`input[name="jenis"][value="${jenis}"]`).checked = true;

  const hariBerlaku = data?.hari_berlaku ? (() => { try { return JSON.parse(data.hari_berlaku); } catch { return []; } })() : [];
  for (let i = 0; i <= 6; i++) {
    document.getElementById(`h${i}`).checked = hariBerlaku.includes(i);
  }

  document.getElementById('modalTitle').textContent = data ? 'Edit Promo' : 'Tambah Promo';
  onJenisChange();
  document.getElementById('promoModal').classList.add('open');
}

function editPromo(data) { openModal(data); }
function closeModal() { document.getElementById('promoModal').classList.remove('open'); }

async function savePromo() {
  const id = document.getElementById('promoId').value;
  const jenis = document.querySelector('input[name="jenis"]:checked')?.value || 'persen';

  const hariBerlaku = [];
  for (let i = 0; i <= 6; i++) {
    if (document.getElementById(`h${i}`).checked) hariBerlaku.push(i);
  }

  const body = {
    nama: document.getElementById('fNama').value.trim(),
    deskripsi: document.getElementById('fDeskripsi').value.trim() || null,
    jenis,
    diskon_persen: parseFloat(document.getElementById('fDiskonPersen').value) || 0,
    diskon_nominal: parseFloat(document.getElementById('fDiskonNominal').value) || 0,
    min_pembelian: parseFloat(document.getElementById('fMinBeli').value) || 0,
    berlaku_mulai: document.getElementById('fMulai').value || null,
    berlaku_sampai: document.getElementById('fSampai').value || null,
    hari_berlaku: hariBerlaku.length ? JSON.stringify(hariBerlaku) : null,
    aktif: document.getElementById('fAktif').checked
  };

  if (!body.nama) { showToast('Nama promo wajib diisi', true); return; }
  if (body.jenis === 'persen' && !body.diskon_persen) { showToast('Masukkan persentase diskon', true); return; }
  if (body.jenis === 'nominal' && !body.diskon_nominal) { showToast('Masukkan nominal diskon', true); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const url = id ? `/api/v1/promo/${id}` : '/api/v1/promo';
    const method = id ? 'PUT' : 'POST';
    const r = await fetch(url, { method, credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message);
    closeModal();
    loadPromo();
  } catch { showToast('Koneksi gagal', true); }
  finally { btn.disabled = false; }
}

document.getElementById('promoModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

loadPromo();
</script>
<script src="/js/nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>Layanan — POS Laundry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.33.0/dist/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 1200px; margin: 0 auto; }
    .pos-topbar { display: none !important; }

    /* ── Header ─────────────────────────────────── */
    .ly-head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .ly-head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .ly-title { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }
    .btn-add {
      height: 36px; padding: 0 14px; border: none; border-radius: 8px;
      background: #2D3BB5; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-add:active { transform: scale(.97); }

    /* ── Search ─────────────────────────────────── */
    .search-wrap { padding: 0 16px 10px; }
    .search-wrap input {
      width: 100%; height: 42px; border: 1.5px solid #E2E8F0;
      border-radius: 10px; padding: 0 14px; font-size: 14px;
      font-family: inherit; color: #1E2A6E; outline: none; background: #fff;
    }
    .search-wrap input:focus { border-color: #2D3BB5; }

    /* ── Filter pills ─────────────────────────── */
    .pill-row {
      display: flex; gap: 6px; padding: 0 16px 6px;
      overflow-x: auto; scrollbar-width: none;
    }
    .pill-row::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; padding: 0 14px; height: 36px;
      border: 1px solid #E2E8F0; background: #fff; color: #64748B;
      border-radius: 999px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill.active { background: #2D3BB5; color: #fff; border-color: #2D3BB5; }
    .pill .pill-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }

    /* ── Body ───────────────────────────────────── */
    .body-wrap {
      padding: 4px 16px 130px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* ── Layanan cards (mobile) ── */
    .lay-list { display: flex; flex-direction: column; gap: 10px; }
    .lay-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .lay-card.off { opacity: .55; }
    .lay-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .lay-nama {
      font-size: 14px; font-weight: 700; color: #1E2A6E; flex: 1; min-width: 0;
      display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .lay-harga {
      font-size: 15px; font-weight: 800; color: #1E2A6E; white-space: nowrap;
    }
    .lay-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: #94A3B8;
    }
    .cat-tag {
      display: inline-block;
      padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
    }
    .lay-hpp { font-size: 12px; color: #94A3B8; }
    .lay-hpp .green { color: #10B981; font-weight: 700; }
    .lay-hpp .add-link {
      color: #2D3BB5; text-decoration: none; font-weight: 700;
    }
    .lay-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-top: 8px; border-top: 1px solid #F1F5F9;
    }
    .lay-est { font-size: 12px; color: #64748B; }
    .lay-actions { display: flex; align-items: center; gap: 6px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
    }
    .badge-off { background: #F1F5F9; color: #94A3B8; }

    /* Toggle */
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #E2E8F0; border-radius: 99px;
      cursor: pointer; transition: .2s;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #10B981; }
    input:checked + .slider::before { transform: translateX(16px); }

    /* Buttons */
    .btn {
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid transparent;
      font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-primary { background: #2D3BB5; color: #fff; }
    .btn-outline { background: #fff; border-color: #E2E8F0; color: #64748B; }
    .btn-danger { background: #EF4444; color: #fff; }
    .btn-ghost {
      background: none; border: none; color: #64748B;
      padding: 6px 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .btn-ghost:hover { background: #F1F5F9; border-radius: 6px; color: #1E2A6E; }

    /* Empty */
    .empty {
      text-align: center; padding: 40px 20px; color: #94A3B8;
      background: #fff; border-radius: 10px; border: 1px dashed #E2E8F0;
    }
    .empty .ttl { font-size: 15px; font-weight: 700; color: #64748B; margin-bottom: 4px; }
    .empty .sub { font-size: 13px; }

    /* ══ DESKTOP: Accordion + Table ══ */
    .cat-list { display: none; }
    @media (min-width: 1024px) {
      .lay-list { display: none; }
      .cat-list { display: flex; flex-direction: column; gap: 12px; }
      .cat-card {
        background: #fff; border-radius: 10px;
        box-shadow: 0 1px 3px rgba(45,59,181,0.08);
        overflow: hidden;
      }
      .cat-header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px; cursor: pointer; user-select: none;
      }
      .cat-header:hover { background: #F8FAFF; }
      .cat-icon {
        width: 40px; height: 40px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; flex-shrink: 0; color: #fff;
      }
      .cat-info { flex: 1; min-width: 0; }
      .cat-nama { font-size: 15px; font-weight: 700; }
      .cat-meta { font-size: 12px; color: #94A3B8; margin-top: 2px; }
      .cat-actions { display: flex; gap: 6px; align-items: center; }
      .cat-chevron {
        color: #94A3B8;
        transition: transform .2s; flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .cat-card.open .cat-chevron { transform: rotate(180deg); }
      .cat-body { border-top: 1px solid #F1F5F9; display: none; }
      .cat-card.open .cat-body { display: block; }

      .lay-table { width: 100%; border-collapse: collapse; }
      .lay-table th {
        padding: 9px 14px; text-align: left;
        font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .4px;
        color: #64748B;
        border-bottom: 1px solid #F1F5F9;
        white-space: nowrap; background: #F8FAFF;
      }
      .lay-table td {
        padding: 10px 14px;
        border-bottom: 1px solid #F1F5F9;
        vertical-align: middle; font-size: 13px; color: #1E2A6E;
      }
      .lay-table tr:last-child td { border-bottom: none; }
      .lay-table tr:hover td { background: #F8FAFF; }
      .td-actions { display: flex; gap: 5px; align-items: center; }
      .empty-row td {
        text-align: center; padding: 28px;
        color: #94A3B8; font-size: 13px;
      }
      .margin-info { font-size: 11px; color: #94A3B8; margin-top: 3px; }
      .margin-info .isi { color: #10B981; font-weight: 700; }
      .margin-info a { color: #2D3BB5; text-decoration: none; font-weight: 700; }
    }

    /* ── Bottom-sheet Modal ── */
    .lm-bg {
      display: none; position: fixed !important; inset: 0 !important;
      background: rgba(30,42,110,0.45) !important; z-index: 100 !important;
      align-items: flex-end; justify-content: center;
    }
    .lm-bg.open { display: flex; }
    .lm {
      background: #fff; border-radius: 18px 18px 0 0;
      width: 100%; max-width: 100%; max-height: 92vh; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 -8px 32px rgba(45,59,181,.18);
    }
    .lm-h {
      padding: 14px 18px;
      border-bottom: 1px solid #E2E8F0;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: #fff; z-index: 2;
    }
    .lm-h .ttl { font-size: 16px; font-weight: 800; color: #1E2A6E; }
    .lm-x {
      width: 32px; height: 32px; border-radius: 8px;
      background: #F1F5F9; border: none; cursor: pointer; color: #64748B;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .lm-b { padding: 16px 18px; overflow-y: auto; flex: 1; }
    .lm-f {
      padding: 12px 18px; border-top: 1px solid #E2E8F0;
      display: flex; justify-content: flex-end; gap: 8px;
      flex-wrap: wrap; position: sticky; bottom: 0; background: #fff;
    }
    @media (min-width: 1024px) {
      .lm-bg { align-items: center; padding: 16px; }
      .lm { max-width: 540px; border-radius: 14px; }
    }

    /* Form */
    .fg { margin-bottom: 14px; }
    .fg label, .form-label {
      display: block; font-size: 12px; font-weight: 700;
      color: #64748B; margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: .3px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #E2E8F0; border-radius: 8px;
      font-size: 14px; color: #1E2A6E;
      outline: none; background: #fff; font-family: inherit; min-height: 44px;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #2D3BB5; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-hint { font-size: 11px; color: #94A3B8; margin-top: 4px; }

    /* Icon & color picker */
    .icon-picker {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
      max-height: 200px; overflow-y: auto;
      border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px;
    }
    @media (min-width: 600px) {
      .icon-picker { grid-template-columns: repeat(8, 1fr); }
    }
    .icon-opt {
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 4px; border-radius: 6px; cursor: pointer;
      border: 2px solid transparent; transition: all .1s;
      font-size: 20px;
    }
    .icon-opt:hover { background: #E3F2FF; }
    .icon-opt.selected { border-color: #2D3BB5; background: #E3F2FF; }
    .icon-opt span { font-size: 9px; color: #64748B; margin-top: 2px; }

    .color-palette { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .color-opt {
      width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; border: 3px solid transparent;
      transition: border-color .1s;
    }
    .color-opt.selected { border-color: #1E2A6E; }
    .color-custom {
      padding: 3px;
      border: 1px solid #E2E8F0; border-radius: 50%;
      cursor: pointer; width: 28px; height: 28px;
    }

    /* Margin preview & mode toggle */
    .mode-toggle {
      display: flex; border: 1.5px solid #E2E8F0;
      border-radius: 8px; overflow: hidden; margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1; padding: 9px;
      font-size: 12px; font-weight: 700;
      border: none; background: #F8FAFF;
      color: #94A3B8; cursor: pointer; font-family: inherit;
    }
    .mode-btn.active { background: #E3F2FF; color: #2D3BB5; }
    .margin-preview {
      background: #F8FAFF; border-radius: 8px; padding: 10px 14px;
      font-size: 12px; margin-top: 8px; display: none; color: #64748B;
    }
    .margin-preview.show { display: block; }
    .margin-preview table { width: 100%; border-collapse: collapse; }
    .margin-preview td { padding: 2px 0; }
    .margin-preview .lbl { color: #94A3B8; width: 50%; }
    .margin-preview .val { font-weight: 700; text-align: right; color: #1E2A6E; }
    .margin-preview .val.green { color: #10B981; }
    .margin-preview .val.big { font-size: 14px; color: #2D3BB5; }

    /* Inline harga edit */
    .harga-display {
      cursor: pointer; font-weight: 700;
      border-bottom: 1px dashed #E2E8F0;
      padding: 2px 4px; border-radius: 3px;
    }
    .harga-display:hover {
      background: #E3F2FF;
      border-bottom-color: #2D3BB5;
    }
    .harga-input-wrap { display: none; align-items: center; gap: 4px; }
    .harga-input-wrap.active { display: flex; }
    .harga-inp {
      width: 100px; padding: 4px 8px;
      border: 1px solid #2D3BB5; border-radius: 6px;
      font-size: 13px; font-weight: 700; outline: none;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: #1E2A6E; color: #fff;
      padding: 10px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 9999;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
      max-width: calc(100vw - 32px); text-align: center;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: #EF4444; }
    @media (min-width: 1024px) {
      #toast { bottom: 24px; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="ly-head">
    <a class="ic-btn" href="/dashboard" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="ly-title">Layanan</div>
    <button class="btn-add" onclick="openKategoriModal()" aria-label="Tambah kategori">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Kategori</span>
    </button>
  </div>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Cari nama layanan…" oninput="renderMobile();renderAkordion();"/>
  </div>

  <div class="pill-row" id="pillRow">
    <button class="pill active" data-cat="all" onclick="setFilter('all')">Semua</button>
  </div>

  <div class="body-wrap">
    <!-- Mobile card list -->
    <div class="lay-list" id="layList">
      <div class="empty"><div class="ttl">Memuat…</div></div>
    </div>

    <!-- Desktop accordion list -->
    <div class="cat-list" id="catList"></div>
  </div>
</div>

<!-- ── Modal Kategori ── -->
<div class="lm-bg" id="katModal">
  <div class="lm">
    <div class="lm-h">
      <div class="ttl" id="katModalTitle">Tambah Kategori</div>
      <button class="lm-x" onclick="closeModal('katModal')" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>
    <div class="lm-b">
      <input type="hidden" id="katId"/>
      <div class="fg">
        <label>Nama Kategori *</label>
        <input type="text" id="katNama" class="form-input" placeholder="contoh: Cuci Kering"/>
      </div>
      <div class="fg">
        <label>Deskripsi</label>
        <input type="text" id="katDeskripsi" class="form-input" placeholder="Opsional"/>
      </div>
      <div class="fg">
        <label>Ikon</label>
        <div class="icon-picker" id="iconPicker"></div>
        <div class="form-hint" id="selectedIconLabel">Dipilih: —</div>
      </div>
      <div class="fg">
        <label>Warna</label>
        <div class="color-palette" id="colorPalette"></div>
      </div>
      <div class="fg" style="display:flex;align-items:center;gap:10px;">
        <label class="toggle">
          <input type="checkbox" id="katAktif" checked/>
          <span class="slider"></span>
        </label>
        <span style="font-size:13px;font-weight:700;color:#1E2A6E">Aktif</span>
      </div>
    </div>
    <div class="lm-f">
      <button class="btn btn-outline" onclick="closeModal('katModal')">Batal</button>
      <button class="btn btn-primary" id="katSaveBtn" onclick="saveKategori()">Simpan</button>
    </div>
  </div>
</div>

<!-- ── Modal Layanan ── -->
<div class="lm-bg" id="layModal">
  <div class="lm">
    <div class="lm-h">
      <div class="ttl" id="layModalTitle">Tambah Layanan</div>
      <button class="lm-x" onclick="closeModal('layModal')" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>
    <div class="lm-b">
      <input type="hidden" id="layId"/>
      <div class="fg">
        <label>Nama Layanan *</label>
        <input type="text" id="layNama" class="form-input" placeholder="contoh: Cuci Kering"/>
      </div>
      <div class="fg">
        <label>Kategori</label>
        <select id="layKategori" class="form-select"></select>
      </div>

      <div class="fg">
        <label>Harga &amp; Margin</label>
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" id="modeBtnManual" onclick="setHargaMode('manual')">Manual</button>
          <button type="button" class="mode-btn" id="modeBtnAuto" onclick="setHargaMode('auto')">Dari HPP + Margin</button>
        </div>

        <div id="hargaModeManual">
          <div class="form-row">
            <div>
              <label class="form-label">Harga (Rp) *</label>
              <input type="number" id="layHarga" class="form-input" placeholder="5000" min="0" oninput="updateMarginPreview()"/>
            </div>
            <div>
              <label class="form-label">Satuan</label>
              <select id="laySatuan" class="form-select">
                <option value="kg">kg</option>
                <option value="item">item</option>
                <option value="pcs">pcs</option>
                <option value="lusin">lusin</option>
                <option value="buah">buah</option>
                <option value="pasang">pasang</option>
                <option value="set">set</option>
              </select>
            </div>
          </div>
          <div class="form-row" style="margin-top:10px">
            <div>
              <label class="form-label">HPP (Rp) <span style="font-weight:400;color:#94A3B8;text-transform:none;letter-spacing:0">opsional</span></label>
              <input type="number" id="layHppManual" class="form-input" placeholder="0" min="0" oninput="updateMarginPreview()"/>
            </div>
            <div>
              <label class="form-label">Margin Target (%)</label>
              <input type="number" id="layMarginManual" class="form-input" placeholder="0" min="0" oninput="updateMarginPreview()"/>
            </div>
          </div>
          <div class="margin-preview" id="marginPreviewManual"></div>
        </div>

        <div id="hargaModeAuto" style="display:none">
          <div class="form-row">
            <div>
              <label class="form-label">HPP per <span id="satuanLabelAuto">unit</span> (Rp) *</label>
              <input type="number" id="layHppAuto" class="form-input" placeholder="4200" min="0" oninput="updateMarginPreview()"/>
            </div>
            <div>
              <label class="form-label">Target Margin (%)</label>
              <input type="number" id="layMarginAuto" class="form-input" placeholder="40" min="0" step="0.5" oninput="updateMarginPreview()"/>
            </div>
          </div>
          <div style="margin-top:10px">
            <label class="form-label">Satuan</label>
            <select id="laySatuanAuto" class="form-select" onchange="document.getElementById('satuanLabelAuto').textContent=this.value">
              <option value="kg">kg</option>
              <option value="item">item</option>
              <option value="pcs">pcs</option>
              <option value="lusin">lusin</option>
              <option value="buah">buah</option>
              <option value="pasang">pasang</option>
              <option value="set">set</option>
            </select>
          </div>
          <div class="margin-preview show" id="marginPreviewAuto">
            <table>
              <tr><td class="lbl">HPP</td><td class="val" id="pvHpp">Rp 0</td></tr>
              <tr><td class="lbl">Margin</td><td class="val" id="pvMarginNominal">+ Rp 0</td></tr>
              <tr><td class="lbl">Harga Jual</td><td class="val big" id="pvHargaJual">Rp 0</td></tr>
              <tr><td class="lbl">Untung/unit</td><td class="val green" id="pvUntung">Rp 0</td></tr>
            </table>
          </div>
        </div>
      </div>

      <div class="fg">
        <label>Estimasi Selesai (jam)</label>
        <input type="number" id="layEstimasi" class="form-input" value="24" min="1" placeholder="contoh: 5, 12, 24, 48"/>
        <div class="form-hint">Contoh: 5 jam, 12 jam, 24 jam (1 hari), 48 jam (2 hari), 72 jam (3 hari)</div>
      </div>
      <div class="fg">
        <label>Deskripsi</label>
        <input type="text" id="layDeskripsi" class="form-input" placeholder="Opsional"/>
      </div>
      <div class="fg" style="display:flex;align-items:center;gap:10px;">
        <label class="toggle">
          <input type="checkbox" id="layAktif" checked/>
          <span class="slider"></span>
        </label>
        <span style="font-size:13px;font-weight:700;color:#1E2A6E">Aktif</span>
      </div>
    </div>
    <div class="lm-f">
      <button class="btn btn-outline" onclick="closeModal('layModal')">Batal</button>
      <button class="btn btn-primary" id="laySaveBtn" onclick="saveLayanan()">Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const ICONS = [
  { name:'shirt', label:'Baju' },
  { name:'wash', label:'Cuci' },
  { name:'hanger', label:'Gantung' },
  { name:'package', label:'Paket' },
  { name:'droplets', label:'Bilas' },
  { name:'wind', label:'Kering' },
  { name:'iron', label:'Setrika' },
  { name:'basket', label:'Keranjang' },
  { name:'crown', label:'Premium' },
  { name:'star', label:'Spesial' },
  { name:'bolt', label:'Express' },
  { name:'leaf', label:'Eco' },
  { name:'bed', label:'Sprei' },
  { name:'sofa', label:'Sofa' },
  { name:'shoe', label:'Sepatu' },
  { name:'backpack', label:'Tas' },
  { name:'jacket', label:'Jaket' },
  { name:'tie', label:'Dasi' },
  { name:'filter', label:'Filter' },
  { name:'category', label:'Lainnya' },
  { name:'tool', label:'Alat' },
  { name:'cube', label:'Barang' },
  { name:'droplet', label:'Cair' },
  { name:'flame', label:'Panas' },
];

const COLORS = [
  '#2D3BB5','#2563EB','#0891b2','#10B981','#84cc16',
  '#F59E0B','#ea580c','#EF4444','#db2777','#8B5CF6',
  '#475569','#0f172a'
];

let selectedIcon = 'category';
let selectedColor = '#2D3BB5';
let catData = [];
let activeFilter = 'all';

const fmtRp = n => Number(n||0).toLocaleString('id-ID');

function formatEstimasi(jam) {
  if (!jam || jam <= 0) return '0 jam';
  if (jam < 24) return jam + ' jam';
  const hari = Math.floor(jam / 24);
  const sisaJam = jam % 24;
  if (sisaJam === 0) return hari + ' hari';
  return hari + ' hari ' + sisaJam + ' jam';
}

function getEstimasiJam(l) {
  if (l.estimasi_jam && l.estimasi_jam > 0) return l.estimasi_jam;
  if (l.estimasi_hari && l.estimasi_hari > 0) return l.estimasi_hari * 24;
  return 24;
}

function showToast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  el.classList.toggle('err', !!err);
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Icon & Color pickers ──────────────────────────────────────────────────────
function buildIconPicker() {
  const el = document.getElementById('iconPicker');
  el.innerHTML = ICONS.map(ic => `
    <div class="icon-opt ${ic.name === selectedIcon ? 'selected' : ''}"
         onclick="selectIcon('${ic.name}')" data-icon="${ic.name}">
      <i class="ti ti-${ic.name}"></i>
      <span>${ic.label}</span>
    </div>`).join('');
}
function selectIcon(name) {
  selectedIcon = name;
  document.querySelectorAll('.icon-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.icon === name);
  });
  document.getElementById('selectedIconLabel').textContent = `Dipilih: ${name}`;
}
function buildColorPalette() {
  const el = document.getElementById('colorPalette');
  el.innerHTML = COLORS.map(c =>
    `<div class="color-opt ${c === selectedColor ? 'selected' : ''}"
          style="background:${c}" onclick="selectColor('${c}')" data-color="${c}"></div>`
  ).join('') + `<input type="color" class="color-custom" value="${selectedColor}"
      title="Warna kustom" oninput="selectColor(this.value)"/>`;
}
function selectColor(val) {
  selectedColor = val;
  document.querySelectorAll('.color-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.color === val);
  });
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openKategoriModal(existing = null) {
  selectedIcon = existing?.ikon || 'category';
  selectedColor = existing?.warna || '#2D3BB5';
  document.getElementById('katId').value = existing?.id || '';
  document.getElementById('katNama').value = existing?.nama || '';
  document.getElementById('katDeskripsi').value = existing?.deskripsi || '';
  document.getElementById('katAktif').checked = existing?.aktif !== 0;
  document.getElementById('katModalTitle').textContent = existing ? 'Edit Kategori' : 'Tambah Kategori';
  buildIconPicker();
  buildColorPalette();
  document.getElementById('selectedIconLabel').textContent = `Dipilih: ${selectedIcon}`;
  document.getElementById('katModal').classList.add('open');
}

function openLayananModal(existing = null, defaultKategoriId = null) {
  document.getElementById('layId').value = existing?.id || '';
  document.getElementById('layNama').value = existing?.nama || '';
  document.getElementById('layEstimasi').value = existing?.estimasi_jam || existing?.estimasi_hari * 24 || 24;
  document.getElementById('layDeskripsi').value = existing?.deskripsi || '';
  document.getElementById('layAktif').checked = existing?.aktif !== 0;
  document.getElementById('layModalTitle').textContent = existing ? 'Edit Layanan' : 'Tambah Layanan';

  const sel = document.getElementById('layKategori');
  sel.innerHTML = '<option value="">— Tanpa Kategori —</option>' +
    catData.map(k => `<option value="${k.id}" ${
      (existing?.kategori_id ?? defaultKategoriId) == k.id ? 'selected' : ''
    }>${k.nama}</option>`).join('');

  const isAuto = Number(existing?.harga_auto) === 1;
  setHargaMode(isAuto ? 'auto' : 'manual');

  if (isAuto) {
    document.getElementById('layHppAuto').value = existing?.hpp || '';
    document.getElementById('layMarginAuto').value = existing?.margin_persen || '';
    document.getElementById('laySatuanAuto').value = existing?.satuan || 'kg';
    document.getElementById('satuanLabelAuto').textContent = existing?.satuan || 'unit';
  } else {
    document.getElementById('layHarga').value = existing?.harga || '';
    document.getElementById('laySatuan').value = existing?.satuan || 'kg';
    document.getElementById('layHppManual').value = existing?.hpp || '';
    document.getElementById('layMarginManual').value = existing?.margin_persen || '';
  }
  updateMarginPreview();
  document.getElementById('layModal').classList.add('open');
}

function setHargaMode(mode) {
  const isAuto = mode === 'auto';
  document.getElementById('hargaModeManual').style.display = isAuto ? 'none' : '';
  document.getElementById('hargaModeAuto').style.display = isAuto ? '' : 'none';
  document.getElementById('modeBtnManual').classList.toggle('active', !isAuto);
  document.getElementById('modeBtnAuto').classList.toggle('active', isAuto);
}

function updateMarginPreview() {
  const isAuto = document.getElementById('hargaModeAuto').style.display !== 'none';
  if (isAuto) {
    const hpp = parseFloat(document.getElementById('layHppAuto').value) || 0;
    const margin = parseFloat(document.getElementById('layMarginAuto').value) || 0;
    if (hpp > 0 && margin > 0 && margin < 100) {
      const hargaSebelumBulatkan = hpp / (1 - margin / 100);
      const harga = Math.ceil(hargaSebelumBulatkan / 100) * 100;
      const untung = harga - hpp;
      document.getElementById('pvHpp').textContent = 'Rp ' + fmtRp(hpp);
      document.getElementById('pvMarginNominal').textContent = '+ Rp ' + fmtRp(Math.round(untung));
      document.getElementById('pvHargaJual').textContent = 'Rp ' + fmtRp(harga);
      document.getElementById('pvUntung').textContent = 'Rp ' + fmtRp(untung);
    }
  } else {
    const hpp = parseFloat(document.getElementById('layHppManual').value) || 0;
    const harga = parseFloat(document.getElementById('layHarga').value) || 0;
    const prev = document.getElementById('marginPreviewManual');
    if (hpp > 0 && harga > 0) {
      const margin = ((harga - hpp) / harga * 100).toFixed(1);
      const untung = harga - hpp;
      prev.innerHTML = `HPP: Rp ${fmtRp(hpp)} · Margin: ${margin}% · Untung: <strong style="color:#1E2A6E">Rp ${fmtRp(untung)}/unit</strong>`;
      prev.classList.add('show');
    } else {
      prev.classList.remove('show');
    }
  }
}

// ── Save / API calls ──────────────────────────────────────────────────────────
async function saveKategori() {
  const id = document.getElementById('katId').value;
  const body = {
    nama: document.getElementById('katNama').value.trim(),
    deskripsi: document.getElementById('katDeskripsi').value.trim(),
    ikon: selectedIcon,
    warna: selectedColor,
    aktif: document.getElementById('katAktif').checked
  };
  if (!body.nama) { showToast('Nama kategori wajib diisi', true); return; }
  const btn = document.getElementById('katSaveBtn');
  btn.disabled = true;
  try {
    const url = id ? `/api/v1/kategori-layanan/${id}` : '/api/v1/kategori-layanan';
    const method = id ? 'PUT' : 'POST';
    const r = await fetch(url, { method, credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message);
    closeModal('katModal');
    loadLayanan();
  } catch { showToast('Koneksi gagal', true); }
  finally { btn.disabled = false; }
}

async function saveLayanan() {
  const id = document.getElementById('layId').value;
  const isAuto = document.getElementById('hargaModeAuto').style.display !== 'none';
  const hpp = parseFloat(isAuto
    ? document.getElementById('layHppAuto').value
    : document.getElementById('layHppManual').value) || 0;
  const marginPersen = parseFloat(isAuto
    ? document.getElementById('layMarginAuto').value
    : document.getElementById('layMarginManual').value) || 0;
  const satuan = isAuto
    ? document.getElementById('laySatuanAuto').value
    : document.getElementById('laySatuan').value;
  const harga = isAuto
    ? Math.ceil(hpp / (1 - marginPersen / 100) / 100) * 100
    : parseFloat(document.getElementById('layHarga').value) || 0;

  const body = {
    nama: document.getElementById('layNama').value.trim(),
    kategori_id: parseInt(document.getElementById('layKategori').value) || null,
    harga, satuan,
    estimasi_jam: parseInt(document.getElementById('layEstimasi').value) || 24,
    estimasi_hari: Math.ceil(parseInt(document.getElementById('layEstimasi').value) / 24) || 1,
    deskripsi: document.getElementById('layDeskripsi').value.trim(),
    aktif: document.getElementById('layAktif').checked,
    hpp,
    margin_persen: marginPersen,
    harga_auto: isAuto ? 1 : 0
  };
  if (!body.nama) { showToast('Nama layanan wajib diisi', true); return; }
  if (!body.harga) { showToast('Harga wajib diisi', true); return; }

  const btn = document.getElementById('laySaveBtn');
  btn.disabled = true;
  try {
    const url = id ? `/api/v1/layanan/${id}` : '/api/v1/layanan';
    const method = id ? 'PUT' : 'POST';
    const r = await fetch(url, { method, credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message);
    closeModal('layModal');
    loadLayanan();
  } catch { showToast('Koneksi gagal', true); }
  finally { btn.disabled = false; }
}

async function deleteKategori(id, nama) {
  if (!confirm(`Hapus kategori "${nama}"? Pastikan tidak ada layanan di dalamnya.`)) return;
  try {
    const r = await fetch(`/api/v1/kategori-layanan/${id}`, { method:'DELETE', credentials:'include' });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message);
    loadLayanan();
  } catch { showToast('Koneksi gagal', true); }
}

async function toggleLayanan(id, currentAktif, checkbox) {
  try {
    const r = await fetch(`/api/v1/layanan/${id}/toggle`, { method:'PATCH', credentials:'include' });
    const d = await r.json();
    if (!r.ok) { checkbox.checked = currentAktif; showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message);
  } catch { checkbox.checked = currentAktif; showToast('Koneksi gagal', true); }
}

async function deleteLayanan(id, nama) {
  if (!confirm(`Hapus layanan "${nama}"?`)) return;
  try {
    const r = await fetch(`/api/v1/layanan/${id}`, { method:'DELETE', credentials:'include' });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    showToast(d.message + (d.soft ? ' (dinonaktifkan)' : ''));
    loadLayanan();
  } catch { showToast('Koneksi gagal', true); }
}

// ── Inline harga edit (desktop) ───────────────────────────────────────────────
function showHargaInput(id) {
  const disp = document.getElementById(`harga-disp-${id}`);
  const wrap = document.getElementById(`harga-wrap-${id}`);
  disp.style.display = 'none';
  wrap.classList.add('active');
  wrap.querySelector('input').focus();
}
function hideHargaInput(id) {
  document.getElementById(`harga-disp-${id}`).style.display = '';
  document.getElementById(`harga-wrap-${id}`).classList.remove('active');
}
async function saveHarga(id, input) {
  const harga = parseFloat(input.value);
  if (isNaN(harga) || harga < 0) { showToast('Harga tidak valid', true); return; }
  try {
    const r = await fetch(`/api/v1/layanan/${id}/harga`, {
      method:'PATCH', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ harga })
    });
    const d = await r.json();
    if (!r.ok) { showToast('Gagal: ' + d.error, true); return; }
    document.getElementById(`harga-disp-${id}`).textContent = 'Rp ' + fmtRp(harga);
    hideHargaInput(id);
    showToast('Harga diupdate');
  } catch { showToast('Koneksi gagal', true); }
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(catId) {
  activeFilter = catId;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === String(catId));
  });
  renderMobile();
  renderAkordion();
}

function renderPills() {
  const el = document.getElementById('pillRow');
  let html = `<button class="pill ${activeFilter === 'all' ? 'active' : ''}" data-cat="all" onclick="setFilter('all')">Semua</button>`;
  catData.forEach(k => {
    html += `<button class="pill ${activeFilter === String(k.id) ? 'active' : ''}" data-cat="${k.id}" onclick="setFilter('${k.id}')">
      <span class="pill-dot" style="background:${k.warna || '#2D3BB5'}"></span>
      ${esc(k.nama)}
    </button>`;
  });
  el.innerHTML = html;
}

// ── Render mobile cards ───────────────────────────────────────────────────────
function getFilteredLayanan() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const result = [];
  catData.forEach(k => {
    if (activeFilter !== 'all' && String(k.id) !== String(activeFilter)) return;
    (k.layanan || []).forEach(l => {
      if (q && !l.nama.toLowerCase().includes(q)) return;
      result.push({ ...l, _kat: k });
    });
  });
  return result;
}

function renderMobile() {
  const list = getFilteredLayanan();
  const el = document.getElementById('layList');
  if (!list.length) {
    el.innerHTML = `<div class="empty">
      <div class="ttl">Tidak ada layanan</div>
      <div class="sub">${
        document.getElementById('searchInput').value
          ? 'Coba ubah kata kunci pencarian.'
          : 'Belum ada layanan di kategori ini.'
      }</div>
    </div>`;
    return;
  }
  el.innerHTML = list.map(l => {
    const k = l._kat;
    const hpp = Number(l.hpp || 0);
    const mar = hpp > 0 ? ((l.harga - hpp) / l.harga * 100).toFixed(0) : null;
    const off = !l.aktif;
    const lEsc = JSON.stringify(l).replace(/"/g,'&quot;');
    const nameEsc = (l.nama || '').replace(/'/g,"\\'");
    const catColor = k.warna || '#2D3BB5';
    return `
      <div class="lay-card ${off ? 'off' : ''}">
        <div class="lay-top">
          <div class="lay-nama">
            ${esc(l.nama)}
            ${off ? '<span class="badge badge-off">Nonaktif</span>' : ''}
          </div>
          <div class="lay-harga">Rp ${fmtRp(l.harga)}</div>
        </div>
        <div class="lay-meta">
          <span class="cat-tag" style="background:${catColor}18;color:${catColor}">${esc(k.nama)}</span>
          <span>per ${esc(l.satuan)}</span>
        </div>
        ${hpp > 0
          ? `<div class="lay-hpp">HPP Rp ${fmtRp(hpp)} · <span class="green">Margin ${mar}%</span></div>`
          : `<div class="lay-hpp"><a href="#" class="add-link" onclick="openLayananModal(${lEsc});return false">+ Isi HPP untuk lihat margin</a></div>`
        }
        <div class="lay-foot">
          <div class="lay-est">Est: ${formatEstimasi(getEstimasiJam(l))}</div>
          <div class="lay-actions">
            <label class="toggle" title="${l.aktif ? 'Nonaktifkan' : 'Aktifkan'}">
              <input type="checkbox" ${l.aktif ? 'checked' : ''}
                onchange="toggleLayanan(${l.id}, ${!!l.aktif}, this)"/>
              <span class="slider"></span>
            </label>
            <button class="btn btn-sm btn-outline" onclick='openLayananModal(${JSON.stringify(l)})'>Edit</button>
            <button class="btn-ghost" onclick="deleteLayanan(${l.id}, '${nameEsc}')" style="color:#EF4444">Hapus</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Render desktop accordion ──────────────────────────────────────────────────
function renderAkordion() {
  const el = document.getElementById('catList');
  const visibleCats = catData.filter(k =>
    activeFilter === 'all' || String(k.id) === String(activeFilter)
  );
  if (!visibleCats.length) {
    el.innerHTML = `<div class="empty">
      <div class="ttl">Belum ada kategori</div>
      <div class="sub">Klik tombol "+ Kategori" di header untuk menambah kategori baru.</div>
    </div>`;
    return;
  }
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

  const SVG_CHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
  const SVG_PLUS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  el.innerHTML = visibleCats.map(k => {
    const warna = k.warna || '#2D3BB5';
    const ikon = k.ikon || 'category';
    const list = (k.layanan || []).filter(l => !q || l.nama.toLowerCase().includes(q));

    const layananRows = list.map(l => {
      const hpp = Number(l.hpp || 0);
      const untung = hpp > 0 ? l.harga - hpp : null;
      const mar = hpp > 0 ? ((l.harga - hpp) / l.harga * 100).toFixed(0) : null;
      const lEsc = JSON.stringify(l).replace(/"/g,'&quot;');
      const nameEsc = (l.nama || '').replace(/'/g,"\\'");
      const marginInfo = hpp > 0
        ? `<div class="margin-info">HPP Rp${fmtRp(hpp)} · <span class="isi">Margin ${mar}% · Untung Rp${fmtRp(untung)}/unit</span></div>`
        : `<div class="margin-info"><a href="#" onclick="openLayananModal(${lEsc});return false">+ Isi HPP untuk lihat margin</a></div>`;
      return `
      <tr>
        <td><span style="font-weight:700">${esc(l.nama)}</span>
            ${!l.aktif ? '<span class="badge badge-off" style="margin-left:6px">Nonaktif</span>' : ''}
            ${marginInfo}
        </td>
        <td>
          <span id="harga-disp-${l.id}" class="harga-display" onclick="showHargaInput(${l.id})" title="Klik untuk edit harga">Rp ${fmtRp(l.harga)}</span>
          <div class="harga-input-wrap" id="harga-wrap-${l.id}">
            <input type="number" class="harga-inp" value="${l.harga}" min="0"
                   onkeydown="if(event.key==='Enter') saveHarga(${l.id},this); if(event.key==='Escape') hideHargaInput(${l.id});"
                   onblur="hideHargaInput(${l.id})"/>
            <button class="btn btn-sm btn-primary" onmousedown="event.preventDefault(); saveHarga(${l.id}, document.querySelector('#harga-wrap-${l.id} input'))">Simpan</button>
          </div>
        </td>
        <td>${esc(l.satuan)}</td>
        <td>${l.hpp ? 'Rp ' + fmtRp(l.hpp) : '—'}</td>
        <td>${mar !== null ? mar + '%' : '—'}</td>
        <td>${formatEstimasi(getEstimasiJam(l))}</td>
        <td>
          <label class="toggle">
            <input type="checkbox" ${l.aktif ? 'checked' : ''}
              onchange="toggleLayanan(${l.id}, ${!!l.aktif}, this)"/>
            <span class="slider"></span>
          </label>
        </td>
        <td>
          <div class="td-actions">
            <button class="btn btn-sm btn-outline" onclick='openLayananModal(${JSON.stringify(l)})'>Edit</button>
            <button class="btn-ghost" style="color:#EF4444" onclick="deleteLayanan(${l.id}, '${nameEsc}')">Hapus</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    const emptyRow = !list.length
      ? `<tr class="empty-row"><td colspan="8">${q ? 'Tidak ada layanan cocok.' : 'Belum ada layanan.'}</td></tr>` : '';

    return `
    <div class="cat-card open" id="cat-${k.id}">
      <div class="cat-header" onclick="toggleCat(${k.id})">
        <div class="cat-icon" style="background:${warna}">
          <i class="ti ti-${ikon}"></i>
        </div>
        <div class="cat-info">
          <div class="cat-nama">${esc(k.nama)}
            ${!k.aktif ? '<span class="badge badge-off" style="margin-left:8px">Nonaktif</span>' : ''}
          </div>
          <div class="cat-meta">${k.jumlah_layanan || 0} layanan · ${k.jumlah_aktif || 0} aktif</div>
        </div>
        <div class="cat-actions" onclick="event.stopPropagation()">
          <button class="btn btn-sm btn-primary" onclick="openLayananModal(null, ${k.id})">${SVG_PLUS} Layanan</button>
          <button class="btn btn-sm btn-outline" onclick='openKategoriModal(${JSON.stringify({
            id:k.id, nama:k.nama, deskripsi:k.deskripsi, ikon:k.ikon, warna:k.warna, aktif:k.aktif
          })})'>Edit</button>
          <button class="btn-ghost" style="color:#EF4444" onclick="deleteKategori(${k.id}, '${(k.nama || '').replace(/'/g,"\\'")}')">Hapus</button>
        </div>
        <span class="cat-chevron">${SVG_CHEV}</span>
      </div>
      <div class="cat-body">
        <table class="lay-table">
          <thead>
            <tr>
              <th style="width:32%">Nama</th>
              <th>Harga</th>
              <th>Satuan</th>
              <th>HPP</th>
              <th>Margin</th>
              <th>Est</th>
              <th>Aktif</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>${layananRows}${emptyRow}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function toggleCat(id) {
  const el = document.getElementById(`cat-${id}`);
  el?.classList.toggle('open');
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadLayanan() {
  try {
    const r = await fetch('/api/v1/layanan/per-kategori', { credentials:'include' });
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    catData = (d.data || []).filter(k => k.id !== null);
    renderPills();
    renderMobile();
    renderAkordion();
  } catch(e) {
    console.error(e);
    document.getElementById('layList').innerHTML =
      `<div class="empty"><div class="ttl" style="color:#EF4444">Gagal memuat data</div></div>`;
  }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.querySelectorAll('.lm-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});

loadLayanan();
</script>
<script src="/js/nav.js"></script>
</body>
</html>

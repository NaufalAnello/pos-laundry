<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/design-system.css"/>
  <link rel="stylesheet" href="/css/layout.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <title>AI Insight — POS Laundry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: #F0F7FF; color: #1E2A6E; font-size: 14px; min-height: 100vh; }

    .page { max-width: 980px; margin: 0 auto; }
    .pos-topbar { display: none !important; }

    /* ── Header ─────────────────────────────────── */
    .ai-head {
      position: sticky; top: 0; z-index: 20;
      background: #F0F7FF;
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .ai-head .ic-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: #fff; color: #2D3BB5;
      border: none; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .ai-title { flex: 1; font-size: 20px; font-weight: 800; color: #1E2A6E; letter-spacing: -.01em; }

    /* ── Body ─────────────────────────────────── */
    .body-wrap {
      padding: 4px 16px 200px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* ── 3 insight cards ────────────────────────── */
    .insight-card {
      background: #fff; border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
      border-left: 4px solid var(--bar-color, #2D3BB5);
      display: flex; flex-direction: column; gap: 3px;
    }
    .insight-card.tren { --bar-color: #10B981; }
    .insight-card.peringatan { --bar-color: #EF4444; }
    .insight-card.prediksi { --bar-color: #F59E0B; }
    .insight-title { font-size: 13px; font-weight: 700; }
    .insight-card.tren .insight-title { color: #10B981; }
    .insight-card.peringatan .insight-title { color: #EF4444; }
    .insight-card.prediksi .insight-title { color: #F59E0B; }
    .insight-body { font-size: 13px; color: #64748B; line-height: 1.4; }

    .section-ttl {
      font-size: 12px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: .8px;
      padding: 4px 2px 0;
    }

    /* ── Chat bubbles ───────────────────────────── */
    .chat-messages {
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 4px;
    }
    .chat-bubble {
      max-width: 290px; border-radius: 12px;
      padding: 10px 14px; font-size: 13px; line-height: 1.4;
      white-space: pre-wrap;
    }
    .chat-bubble.user {
      align-self: flex-end; background: #2D3BB5; color: #fff;
    }
    .chat-bubble.ai {
      align-self: flex-start; background: #fff; color: #1E2A6E;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .chat-empty {
      text-align: center; color: #94A3B8; font-size: 13px; padding: 20px 0;
    }

    /* ── Input chat (sticky di atas nav) ────────── */
    .chat-input-wrap {
      position: fixed; left: 0; right: 0; bottom: 92px;
      padding: 10px 16px;
      display: flex; gap: 8px; z-index: 10;
      background: linear-gradient(180deg, rgba(240,247,255,0) 0%, #F0F7FF 30%);
    }
    .chat-input-wrap input {
      flex: 1; height: 46px; border: 1.5px solid #E2E8F0; border-radius: 12px;
      padding: 0 14px; font-size: 14px; font-family: inherit;
      color: #1E2A6E; outline: none; background: #fff;
      box-shadow: 0 1px 3px rgba(45,59,181,0.08);
    }
    .chat-input-wrap input:focus { border-color: #2D3BB5; }
    .send-btn {
      width: 46px; height: 46px; border: none; border-radius: 12px;
      background: #2D3BB5; color: #fff; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(45,59,181,0.25);
    }
    .send-btn:active { transform: scale(.96); }
    .send-btn:disabled { opacity: .5; cursor: default; }

    .loading, .error {
      text-align: center; padding: 40px 20px; color: #94A3B8;
      background: #fff; border-radius: 10px; border: 1px dashed #E2E8F0;
    }
    .error { color: #EF4444; }

    @media (min-width: 1024px) {
      .ai-head { padding: 16px 20px 10px; }
      .ai-title { font-size: 22px; }
      .body-wrap { padding: 4px 20px 200px; }
      .chat-input-wrap {
        left: 50%; right: auto; bottom: 24px;
        transform: translateX(-50%);
        max-width: 980px; width: 100%;
        background: transparent;
      }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="ai-head">
    <a class="ic-btn" href="/dashboard" aria-label="Kembali">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="ai-title">AI Insight</div>
  </div>

  <div class="body-wrap">
    <div id="loadingState" class="loading">Menghasilkan insight AI…</div>

    <div id="errorState" class="error" style="display:none">
      <div id="errorMsg"></div>
    </div>

    <div id="insightContent" style="display:none;flex-direction:column;gap:12px">
      <!-- 3 card insight (border-left) -->
      <div class="insight-card tren">
        <div class="insight-title">Tren Bisnis</div>
        <div class="insight-body" id="insightTren">—</div>
      </div>
      <div class="insight-card peringatan">
        <div class="insight-title">Peringatan Stok</div>
        <div class="insight-body" id="insightPeringatan">—</div>
      </div>
      <div class="insight-card prediksi">
        <div class="insight-title">Prediksi Jam Sibuk</div>
        <div class="insight-body" id="insightPrediksi">—</div>
      </div>

      <!-- Chat AI -->
      <div class="section-ttl">Tanya Data Bisnis</div>
      <div class="chat-messages" id="chatMessages"></div>
    </div>
  </div>
</div>

<!-- Input chat sticky di atas nav -->
<div class="chat-input-wrap" id="chatInputWrap" style="display:none">
  <input type="text" id="chatInput" placeholder="Misal: layanan apa paling laku?" />
  <button class="send-btn" id="sendBtn" onclick="sendChat()" aria-label="Kirim">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
  </button>
</div>

<script>
let chatHistory = [];

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}

async function loadInsight() {
  try {
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('insightContent').style.display = 'none';
    document.getElementById('chatInputWrap').style.display = 'none';

    const data = await api('/api/v1/ai/insight');

    // Tren Bisnis
    const tren = data.ringkasan_hari_ini || 'Tidak ada data hari ini';
    document.getElementById('insightTren').textContent = tren;

    // Peringatan Stok
    let peringatan = 'Semua stok aman';
    if (data.peringatan?.length > 0) {
      const stokWarnings = data.peringatan.filter(p => p.pesan.toLowerCase().includes('stok'));
      if (stokWarnings.length > 0) {
        peringatan = stokWarnings.map(w => w.pesan).join('. ');
      }
    }
    document.getElementById('insightPeringatan').textContent = peringatan;

    // Prediksi Jam Sibuk
    let prediksi = 'Belum ada data untuk prediksi';
    try {
      const ps = await api('/api/v1/ai/prediksi-sibuk');
      if (ps.ringkasan?.jam_tersibuk?.label) {
        prediksi = `Jam tersibuk: ${ps.ringkasan.jam_tersibuk.label} (rata-rata ${ps.ringkasan.jam_tersibuk.rata_rata} order/jam)`;
      }
    } catch {}
    document.getElementById('insightPrediksi').textContent = prediksi;

    renderChat();

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('insightContent').style.display = 'flex';
    document.getElementById('chatInputWrap').style.display = 'flex';
  } catch (e) {
    console.error('Error loading insight:', e);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    document.getElementById('errorMsg').textContent = e.message;
  }
}

function renderChat() {
  const container = document.getElementById('chatMessages');
  if (chatHistory.length === 0) {
    container.innerHTML = '<div class="chat-empty">Mulai percakapan dengan AI</div>';
    return;
  }
  container.innerHTML = chatHistory.map(msg => `
    <div class="chat-bubble ${msg.role}">${escHtml(msg.text)}</div>
  `).join('');
  container.scrollTop = container.scrollHeight;
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;

  btn.disabled = true;
  input.value = '';

  chatHistory.push({ role: 'user', text });
  renderChat();

  try {
    const res = await api('/api/v1/ai/chat', {
      method: 'POST',
      body: JSON.stringify({ message: text })
    });
    chatHistory.push({ role: 'ai', text: res.reply || 'Maaf, tidak ada respons' });
    renderChat();
  } catch (e) {
    chatHistory.push({ role: 'ai', text: 'Maaf, terjadi kesalahan: ' + e.message });
    renderChat();
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('chatInput');
  if (input) {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });
  }
  loadInsight();
});

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
<script src="/js/nav.js"></script>
</body>
</html>
